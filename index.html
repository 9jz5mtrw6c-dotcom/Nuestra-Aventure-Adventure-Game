<!DOCTYPE html>
<html lang="nl">
<head>

<title>Nuestra Aventura · El Cañón Escondido — V14 · routes van Nuestra Aventura</title>
<style>
  :root { --forest:#1F4D3A; --deep:#143628; --turq:#2BA8A4; --sand:#E8D5B0; --white:#FBF8F2; --terra:#D9774B; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .toast p { margin: 0; font-size: 14px; opacity: .9; }
  .joy { position: absolute; left: calc(22px + env(safe-area-inset-left)); bottom: calc(22px + env(safe-area-inset-bottom)); width: 130px; height: 130px; border-radius: 50%; background: rgba(20,54,40,.35); border: 1.5px solid rgba(255,255,255,.3); display: none; }
  .joy i { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(251,248,242,.85); box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .acts { position: absolute; right: calc(22px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); display: none; gap: 14px; align-items: flex-end; }
  .act { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 12px; letter-spacing: .05em; color: var(--deep); background: rgba(232,213,176,.92); border: 2px solid #fff; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .act.small { width: 56px; height: 56px; background: rgba(251,248,242,.85); }
  .act.on { background: var(--terra); color: #fff; }
  body.touch .joy, body.touch .acts { display: flex; }
  body.touch .joy { display: block; }
  .keys { position: absolute; left: 12px; bottom: 12px; padding: 8px 12px; font-size: 12px; opacity: .85; }
  body.touch .keys { display: none; }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: radial-gradient(circle at 70% 20%, rgba(43,168,164,.35), transparent 55%), rgba(20,54,40,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 10; transition: opacity .5s; }

  .card { width: min(520px, 100%); max-height: 92vh; overflow: auto; background: var(--white); color: #1D2A24; border-radius: 28px; padding: 26px 24px; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
  .card .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #1F8F8C; }

  .ctrl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13.5px; margin: 14px 0 16px; padding: 14px; background: #F4EBDD; border-radius: 16px; }
  .ctrl kbd { font-family: inherit; font-weight: 700; font-size: 12px; line-height: 1; background: #fff; border: 1px solid rgba(31,77,58,.2); border-bottom-width: 2px; border-radius: 6px; padding: 4px 7px; color: var(--forest); white-space: nowrap; }
  .go { width: 100%; min-height: 54px; border: 0; border-radius: 999px; background: var(--forest); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(31,77,58,.3); }
  .go.ghost { background: transparent; color: var(--forest); box-shadow: none; border: 1.5px solid rgba(31,77,58,.2); margin-top: 10px; }
  .langs { display: flex; gap: 6px; margin-bottom: 14px; }
  .langs button { border: 1.5px solid rgba(31,77,58,.18); background: #fff; color: var(--forest); border-radius: 99px; padding: 6px 12px; font-weight: 700; font-size: 12px; cursor: pointer; }
  .langs button.on { background: var(--forest); color: #fff; border-color: var(--forest); }
  .character-pick { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }
  .character-pick button { border:2px solid rgba(31,77,58,.18); border-radius:15px; background:#F4EBDD; color:var(--deep); padding:12px 8px; font:inherit; cursor:pointer; }
  .character-pick button.on { border-color:var(--terra); background:#fff8ef; box-shadow:0 0 0 2px rgba(217,119,75,.12); }
  .character-pick strong { display:block; font-size:14px; margin-top:4px; }
  .character-pick small { font-size:11px; opacity:.7; }
  .route-pick { display:grid; grid-template-columns:1fr 1fr; gap:5px; margin:6px 0 10px; } .route-pick .rp-t { grid-column:1/-1; }
  .route-pick .rp-t { font-size:12px; font-weight:700; letter-spacing:.06em; color:#1F8F8C; }
  .route-pick button { display:flex; align-items:center; gap:10px; text-align:left; border:2px solid rgba(31,77,58,.18); border-radius:12px; background:#fff; color:var(--deep); padding:5px 8px; font:inherit; font-size:12.5px; line-height:1.2; cursor:pointer; min-height:40px; gap:7px; }
  .route-pick button b { width:22px; height:22px; flex:none; border-radius:50%; background:#F4EBDD; display:grid; place-items:center; font-size:13px; }
  .route-pick button.on { border-color:var(--terra); background:#fff8ef; } .route-pick button.on b { background:var(--terra); color:#fff; }
  .route-pick button:disabled { opacity:.5; cursor:default; } .route-pick small { margin-left:auto; font-size:10px; opacity:.75; white-space:nowrap; } .route-pick button:disabled small { display:none; } .route-pick button:disabled { min-height:34px; }
  .route-pick .more { font-size:12px; color:#6b776f; padding:2px 4px; }
  .fine { font-size: 11.5px !important; color: #6b776f !important; margin-top: 12px !important; }
  .stamp-list { display: grid; gap: 6px; margin: 12px 0; }
  .stamp-list div { display: flex; gap: 10px; align-items: center; font-size: 14px; }
  .stamp-list span { width: 22px; height: 22px; border-radius: 50%; border: 2px dashed #D9774B; flex: none; display: grid; place-items: center; color: #fff; font-size: 12px; }
  .stamp-list .on span { background: #D9774B; border-style: solid; }
  .photo-hint { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); padding: 8px 16px; font-size: 13px; display: none; z-index: 5; }
  body.photo .photo-hint { display: block; }
  #err { display: none; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; background: #1F4D3A; color: var(--sand); z-index: 20; font-size: 18px; transition: opacity .5s; }
  .loading.gone { opacity: 0; pointer-events: none; }
  /* Subtle optical finish: natural contrast, atmospheric edge falloff and a restrained film grain. */
  body::after { content:""; position:fixed; inset:0; z-index:2; pointer-events:none;
    background: radial-gradient(ellipse at 50% 46%, transparent 48%, rgba(9,20,15,.16) 100%),
                linear-gradient(180deg, rgba(255,235,205,.035), transparent 28%, transparent 78%, rgba(7,18,13,.13));
    box-shadow: inset 0 0 110px rgba(8,18,12,.14); }
  canvas { filter: saturate(1.10) contrast(1.045) brightness(1.015); }
  .hud { z-index:3; }
  .photo-hint { z-index:4; }
  /* Map (minimap, tap to enlarge) */
  .minimap { position:absolute; inset:auto; right:12px; filter:none; top:calc(66px + env(safe-area-inset-top)); width:92px; height:216px; padding:0; cursor:pointer; overflow:hidden; display:block; }
  .minimap.big { width:min(300px, 62vw); height:min(690px, calc(100vh - 150px)); }
  @media (max-width: 640px) { .minimap { top:calc(140px + env(safe-area-inset-top)); width:78px; height:184px; } }
  .prompt { position:absolute; left:50%; bottom:calc(120px + env(safe-area-inset-bottom)); transform:translateX(-50%); padding:10px 18px; font-size:14px; font-weight:600; display:none; white-space:nowrap; }
  .prompt.show { display:block; }
  body:not(.touch) .prompt { bottom:58px; }
  #bAct { display:none; background: var(--terra); color:#fff; }
  #bAct.show { display:grid; }
  @media (max-width: 640px) { .tr .btn { width:40px; height:40px; } .tr { gap:6px; } }
  /* puzzles */
  .pzcard { width:min(560px,100%); }
  .clue { background:#f6eedb; border-left:4px solid var(--terra); padding:10px 12px; border-radius:10px; font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif; font-style:italic; color:#3b2f24 !important; }
  .pzmsg { color:#b4452a !important; font-weight:700; min-height:1.4em; margin:8px 0 0 !important; }
  .shake { animation: shake .35s; } @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .row { display:flex; gap:10px; margin-top:10px; } .row .go { margin-top:0; }
  #pzBody { margin-top:10px; }
  #pzBody .small, .bookcard .small { font-size:13px !important; color:#6b776f !important; margin:4px 0 8px !important; }
  .lock { display:flex; gap:12px; justify-content:center; }
  .dial { display:flex; flex-direction:column; align-items:center; background:#1D2A24; border-radius:14px; padding:6px; }
  .dial button { width:54px; height:40px; border:0; border-radius:10px; background:#2e4038; color:#E8D5B0; font-size:16px; cursor:pointer; }
  .dial span { font:700 34px/1.2 ui-monospace, Menlo, monospace; color:#fff; padding:4px 0; }
  .pz-in { width:100%; font-size:20px; padding:12px 14px; border-radius:12px; border:2px solid rgba(31,77,58,.25); text-transform:uppercase; letter-spacing:.12em; font-weight:700; color:var(--deep); background:#fff; }
  .pz-in:focus { outline:3px solid rgba(43,168,164,.4); border-color:var(--turq); }
  .cipher { font:700 26px ui-monospace, Menlo, monospace; letter-spacing:.3em; text-align:center; padding:10px; background:#7d6b58; color:#f6eedb; border-radius:12px; margin-bottom:10px; }
  .cipher.sm { font-size:18px; padding:6px; }
  .planks { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .plank { height:110px; border:3px solid #5b4636; border-radius:8px; background:color-mix(in srgb, var(--c) 45%, #8a6a48); cursor:pointer; transition:transform .1s, filter .1s; }
  .plank.lit { background:var(--c); filter:brightness(1.35); transform:scale(1.05); box-shadow:0 0 22px var(--c); }
  .pipes-wrap { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .inlet, .outlet { color:var(--turq); font-size:20px; line-height:1; }
  .pipes { display:grid; grid-template-columns:repeat(3,76px); gap:4px; }
  .pipes button { width:76px; height:76px; padding:0; border:0; background:none; cursor:pointer; }
  .steps { display:grid; gap:8px; }
  .steps button { text-align:left; min-height:46px; padding:8px 12px; border:2px solid rgba(31,77,58,.18); border-radius:12px; background:#fff; color:var(--deep); font:inherit; font-size:15px; cursor:pointer; display:flex; gap:10px; align-items:center; }
  .steps button span { width:24px; height:24px; flex:none; border-radius:50%; background:#F4EBDD; display:grid; place-items:center; font-weight:800; font-size:13px; }
  .steps button.on { border-color:var(--turq); background:#eaf6f5; } .steps button.on span { background:var(--turq); color:#fff; }
  .pz-solved { text-align:center; } .pz-solved b { font-size:22px; color:var(--forest); display:block; margin-bottom:6px; }
  .tiles { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .tile { width:38px; height:46px; border-radius:8px; background:#1D2A24; color:#E8D5B0; display:grid; place-items:center; font:700 22px ui-monospace, Menlo, monospace; }
  .tile.big { width:64px; height:76px; font-size:40px; margin:8px auto 0; background:var(--terra); color:#fff; }
  .tile.blank { background:#e8e0cf; }
  /* travel book */
  .bookcard { width:min(600px,100%); }
  .bk-top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .bk-top b { font-size:22px; color:var(--deep); }
  .tabs { display:flex; gap:6px; }
  .tabs button { border:1.5px solid rgba(31,77,58,.18); background:#fff; color:var(--forest); border-radius:99px; padding:8px 14px; font-weight:700; font-size:13px; cursor:pointer; min-height:38px; }
  .tabs button.on { background:var(--forest); color:#fff; border-color:var(--forest); }
  .pp-head { display:flex; justify-content:space-between; gap:10px; background:#1F4D3A; color:#E8D5B0; border-radius:14px; padding:12px 14px; margin-bottom:12px; }
  .pp-head small { display:block; font-size:11px; letter-spacing:.08em; opacity:.8; } .pp-head b { font-size:16px; color:#fff; }
  .slots { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; background:#f6eedb; border-radius:14px; padding:12px; margin-bottom:10px;
           background-image:repeating-linear-gradient(0deg, transparent 0 22px, rgba(91,70,54,.07) 22px 23px); }
  @media (max-width:520px) { .slots { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .stamp { aspect-ratio:1; border-radius:50%; border:3px double #b4452a; color:#b4452a; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:6px; background:rgba(217,119,75,.08); }
  .stamp .ico { font-size:26px; line-height:1.1; } .stamp .nm { font-size:10.5px; font-weight:800; line-height:1.15; text-transform:uppercase; letter-spacing:.02em; } .stamp .dt { font-size:10px; margin-top:2px; font-weight:700; }
  .stamp.empty { border:2px dashed rgba(91,70,54,.35); color:rgba(91,70,54,.55); background:none; } .stamp.empty .num { font:700 20px Georgia, serif; }
  .paper { background:#f6eedb; border-radius:14px; padding:16px 18px; min-height:260px; color:#3b2f24; font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;
           background-image:repeating-linear-gradient(0deg, transparent 0 26px, rgba(91,70,54,.09) 26px 27px); box-shadow:inset 0 0 0 1px rgba(91,70,54,.12); }
  .paper h3 { margin:0 0 8px; font-size:22px; color:#143628; } .paper p { color:#3b2f24 !important; font-size:15.5px !important; }
  .paper .hand { font-style:italic; } .paper .muted { opacity:.7; } .paper .ok { color:#1F8F8C !important; font-weight:700; font-family:-apple-system, Segoe UI, sans-serif; }
  .paper .sub { font-weight:700; color:#b4452a !important; margin-top:-4px !important; }
  .paper.final { box-shadow:inset 0 0 0 2px var(--terra); }
  .sketch { width:100%; height:auto; border-radius:10px; margin:4px 0 10px; display:block; }
  .bk-nav { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .bk-nav button { width:48px; height:44px; border-radius:12px; border:1.5px solid rgba(31,77,58,.2); background:#fff; color:var(--forest); font-size:16px; cursor:pointer; }
  .bk-nav button:disabled { opacity:.35; } .bk-nav span { font-size:13px; color:#6b776f; }
</style>

<canvas id="c"></canvas>
<div class="loading serif" id="loading">Nuestra Aventura…</div>

  <div class="card">
    <div class="langs" id="langs"></div>
    <div class="eyebrow">Aventura Virtual Hike</div>

    <div class="stamp-list" id="mList"></div>

    <button class="go ghost" id="bMenuBook"></button>
    <button class="go ghost" id="bRestart"></button>

  </div>
</div>

// extra water: the waterfall inside the Buñol cave
function buildLevelWater(g) {

  const c = LV.cave, x = c.x, z = c.z, top = c.y - .3 + c.h, bot = c.y - .1;
  for (let k = 0; k < 2; k++) {
    const zz = z + (k ? .02 : -.02), l = g.vert(x - .45, top, zz, 0, 0, -1, 0, 0, 0), r = g.vert(x + .45, top, zz, 0, 0, -1, 0, 0, 0);

    g.tri(l, l2, r); g.tri(r, l2, r2);
  }
  const y = bot + .02, s = 1.6, a = g.vert(x - s, y, z - s, 0, 1, 0, 0, 0, 0), b = g.vert(x + s, y, z - s, 0, 1, 0, 0, 0, 0),

let NPCS = [];
function initNPCs() {
  NPCS = (LV.npcs || []).map((n, i) => {
    const o = Object.assign({}, n, { anim: i * 1.7, speed: n.walk ? 1.05 + .15 * (i % 3) : 0, onGround: true, swim: false, mode: null, t: 0, vy: 0, ab: null,
      character: n.w ? 'woman' : 'man', dir: i % 2 ? 1 : -1 });
    if (n.walk) { o.z = mix(n.z0, Math.min(n.z1, 580), ((i * .37) % 1)); o.x = trailX(o.z, n.side) + n.off; }
    else if (n.view) { o.x = LV.view.x - 1.5 + n.dx * .0; o.z = LV.view.z - 1 + n.dx; o.face = -Math.PI / 2; }
    o.y = height(o.x, o.z); return o;

}
function updateNPCs(dt) {
  for (const n of NPCS) {
    n.t = S.t;
    if (n.walk) {
      n.z += n.dir * n.speed * dt; if (n.z > n.z1) n.dir = -1; if (n.z < n.z0) n.dir = 1;
      const x0 = trailX(n.z, n.side) + n.off, x1 = trailX(n.z + n.dir, n.side) + n.off;
      n.face = Math.atan2(x1 - x0, n.dir); n.x = x0; n.anim += dt * n.speed * 2.1;
    } else n.anim += dt * .3;
    n.y = height(n.x, n.z);
    if (n.view) n.y = Math.max(n.y, LV.view.y + .25);
  }
}

function render() {
  const aspect = canvas.width / canvas.height;
  // camera
  let yaw = S.camYaw, pitch = S.camPitch, dist = S.camDist;
  const firstPerson = false;
  let tx = S.x, ty = S.y + 1.30, tz = S.z;
  let cxp, cyp, czp, lookX, lookY, lookZ;
  if (!S.photo) {
    // Play camera: smooth third-person chase view. Drag on the right side to orbit around the character.
    const bob = S.speed > 0.15 ? Math.sin(S.anim * .5) * .025 * clamp(S.speed / 3.6, 0, 1.4) : 0;
    let chaseDist = clamp(dist || 3.9, 3.1, 8.5);
    // pull the camera in when a canyon wall or rock is between it and the character (narrow gorges)
    { const hx = S.x, hy = S.y + 1.55, hz = S.z, sx = Math.sin(yaw) * Math.cos(pitch), sz = Math.cos(yaw) * Math.cos(pitch), sy = Math.sin(pitch);
      for (let i = 1; i <= 10; i++) { const d = chaseDist * i / 10; if (height(hx + sx * d, hz + sz * d) + .5 > hy + sy * d) { chaseDist = Math.max(1.2, d * .8); break; } } }
    cxp = S.x + Math.sin(yaw) * Math.cos(pitch) * chaseDist;
    czp = S.z + Math.cos(yaw) * Math.cos(pitch) * chaseDist;
    cyp = S.y + 1.55 + Math.sin(pitch) * chaseDist + bob;
    for (let i = 0; i < 8; i++) { const gh = height(cxp, czp) + .65; if (cyp > gh) break; cyp += .35; }
    // keep the camera above the rock slide so it never looks at it from underneath
    if (czp > SLIDE.z0 && czp < SLIDE.z1 && Math.abs(cxp - SLIDE.x(czp)) < 2.2) cyp = Math.max(cyp, SLIDE.y(czp) + 1.2);
    lookX = S.x; lookY = S.y + 1.05; lookZ = S.z;
  } else {
    // Photo mode keeps a wider cinematic orbit camera.
    yaw += S.t * .12; pitch = .22; dist = 10;
    cxp = tx + Math.sin(yaw) * Math.cos(pitch) * dist;
    czp = tz + Math.cos(yaw) * Math.cos(pitch) * dist;
    cyp = ty + Math.sin(pitch) * dist;
    for (let i = 0; i < 8; i++) { const gh = height(cxp, czp) + .6; if (cyp > gh) break; dist *= .82; cxp = tx + Math.sin(yaw) * Math.cos(pitch) * dist; czp = tz + Math.cos(yaw) * Math.cos(pitch) * dist; cyp = ty + Math.sin(pitch) * dist; }
    cyp = Math.max(cyp, height(cxp, czp) + .6);
    lookX = tx; lookY = ty; lookZ = tz;
  }
  const k = 1 - Math.exp(-1 / 60 * 14);
  S.camPos = S.camPos[0] === 0 && S.camPos[2] === 0 ? [cxp, cyp, czp] : [mix(S.camPos[0], cxp, k), mix(S.camPos[1], cyp, k), mix(S.camPos[2], czp, k)];
  const V = M4.look(S.camPos, [lookX, lookY, lookZ], [0, 1, 0]);
  const Pm = M4.persp(innerWidth < innerHeight ? 1.22 : 1.04, aspect, 0.08, 900);
  const VP = M4.mul(Pm, V);

  gl.clearColor(FOGC[0], FOGC[1], FOGC[2], 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK); gl.frontFace(gl.CCW);

  // sky
  gl.disable(gl.CULL_FACE); gl.depthMask(false);
  gl.useProgram(P.sky.p); gl.uniformMatrix4fv(P.sky.u.uInvVP, false, invert(VP)); gl.uniform3fv(P.sky.u.uSun, SUN); gl.uniform3fv(P.sky.u.uFog, FOGC);
  for (let i = 0; i < 4; i++) gl.disableVertexAttribArray(i);
  gl.bindBuffer(gl.ARRAY_BUFFER, skyQuad); gl.enableVertexAttribArray(P.sky.a.pos); gl.vertexAttribPointer(P.sky.a.pos, 3, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3); gl.depthMask(true);

  // opaque world
  common(P.lit, VP);
  gl.uniformMatrix4fv(P.lit.u.uM, false, M4.ident()); gl.uniform3fv(P.lit.u.uTint, [1, 1, 1]); gl.uniform1f(P.lit.u.uAlpha, 1);
  gl.uniform1f(P.lit.u.uTerrain, 1); bindMesh(terrain); gl.drawElements(gl.TRIANGLES, terrain.n, gl.UNSIGNED_INT, 0);
  gl.uniform1f(P.lit.u.uTerrain, 0); gl.disable(gl.CULL_FACE); bindMesh(props); gl.drawElements(gl.TRIANGLES, props.n, gl.UNSIGNED_INT, 0);
  drawCharacter(VP);
  for (const n of NPCS) if (Math.hypot(n.x - S.camPos[0], n.z - S.camPos[2]) < 70) drawCharacter(VP, n);
  drawRopes();
  gl.enable(gl.CULL_FACE);

  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.disable(gl.CULL_FACE); gl.depthMask(false);

}

function buildPuzzle(id, el) {

      const shuffled = got.map((l, i) => [l, Math.sin(i * 12.9898 + 4.1)]).sort((a, b) => a[1] - b[1]).map(x => x[0]);

/* ------------------------------------------------------------- ropes */
function cyl(a, b, r, col) {
  const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2], L = Math.hypot(dx, dy, dz) || 1e-4;
  const ux = -dx / L, uy = -dy / L, uz = -dz / L, rx = Math.acos(clamp(uy, -1, 1)), ry = Math.atan2(ux, uz);
  bindMesh(BODY.neck);
  gl.uniformMatrix4fv(P.lit.u.uM, false, M4.trs((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2, ry, rx, r, L, r));
  gl.uniform3fv(P.lit.u.uTint, col); gl.drawElements(gl.TRIANGLES, BODY.neck.n, gl.UNSIGNED_INT, 0);
}
function drawRopes() {
  if (ABSEIL.z === FAR) return;
  const A = ABSEIL, col = [.92,.36,.2], top = [A.xa, height(A.xa, A.z) + 1.25, A.z], edge = [A.xe - .05, A.ye + .12, A.z];
  const ab = S.mode === 'abseil' ? S.ab : null;
  if (ab && ab.p < 1) {
    const hip = [S.x + .25, S.y + 1.15, S.z]; cyl(top, hip, .025, col);
    // the rest of the rope hangs over the edge
    let prev = edge; for (let i = 1; i <= 10; i++) { const y = mix(A.ye, A.yb + .2, i / 10), p = [wallX(y) + .12, y, A.z + .3]; cyl(prev, p, .025, col); prev = p; }
    cyl([hip[0], hip[1], hip[2]], edge, .025, col);
    return;
  }
  cyl(top, edge, .025, col);
  const endY = ab ? S.y + 1.15 : A.yb + .15, endX = ab ? S.x - .15 : wallX(A.yb + .2) + .12;
  let prev = edge;
  for (let i = 1; i <= 12; i++) {
    const t = i / 12, y = mix(A.ye, endY, t), wx = wallX(y) + .1;
    const x = ab ? mix(wx, endX, Math.pow(t, 3)) : wx, p = [x, y, A.z];
    cyl(prev, p, .025, col); prev = p;
  }
  if (!ab) cyl(prev, [A.xb + .6, A.yb + .05, A.z + 1.0], .025, col);
}

/* --------------------------------------------------------------- map */
const MAPX = [-135, 135];
let mapBG = null, mapBig = false;
function buildMap() {
  const W = 135, H = 310; mapBG = document.createElement('canvas'); mapBG.width = W; mapBG.height = H;
  const c = mapBG.getContext('2d'), img = c.createImageData(W, H);
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const RIV = hex('#2BA8A4'), FLO = hex('#7da05c'), WAL = hex('#c27a52'), PLA = hex('#e6d3a8'), FALL = hex('#f4fbfa');
  for (let j = 0; j < H; j++) {
    const z = Z0 + (j + .5) / H * (Z1 - Z0), c0 = cx(z), rw = riverW(z), ws = wallStart(z);
    const fall = FALLS.some(f => Math.abs(z - f.z - .5) < 1.4);
    for (let i = 0; i < W; i++) {
      const x = MAPX[0] + (i + .5) / W * (MAPX[1] - MAPX[0]), d = Math.abs(x - c0), ramp = rampAmt(x, z), wd = mix(9, 70, ramp);
      let col = d < rw ? (fall ? FALL : RIV) : d < ws ? FLO : d < ws + wd ? WAL : PLA;
      if (d >= ws && d < ws + wd && ramp > .2) col = col.map((v, k) => mix(v, PLA[k], .45));
      const shade = .93 + .07 * fbm(x * .05, z * .05), o = (j * W + i) * 4;
      img.data[o] = col[0] * shade; img.data[o + 1] = col[1] * shade; img.data[o + 2] = col[2] * shade; img.data[o + 3] = 255;
    }
  }
  c.putImageData(img, 0, 0);
  const P2 = (x, z) => [(x - MAPX[0]) / (MAPX[1] - MAPX[0]) * W, (z - Z0) / (Z1 - Z0) * H];
  c.lineCap = 'round';
  // trail along the river
  c.strokeStyle = 'rgba(255,248,230,.7)'; c.lineWidth = 1; c.setLineDash([2, 2]); c.beginPath();
  for (let z = 10; z < 585; z += 4) { const p = P2(cx(z) + riverW(z) + 5.5 + 2 * Math.sin(z * .05), z); z === 10 ? c.moveTo(...p) : c.lineTo(...p); }
  c.stroke(); c.setLineDash([]);
  // bridge, slide, plank, abseil rope
  const line = (a, b, col, w) => { c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(...a); c.lineTo(...b); c.stroke(); };
  line(P2(cx(BRIDGE.z) - BRIDGE.half, BRIDGE.z), P2(cx(BRIDGE.z) + BRIDGE.half, BRIDGE.z), '#6b4423', 2.2);
  line(P2(SLIDE.x(SLIDE.z0), SLIDE.z0), P2(SLIDE.x(SLIDE.z1), SLIDE.z1), '#d8dcd6', 2);
  line(P2(DECK.xa, DECK.za), P2(DECK.xb, DECK.zb), '#8a5a2b', 2.4);
  line(P2(ABSEIL.xa, ABSEIL.z), P2(ABSEIL.xb, ABSEIL.z), '#ea5b2e', 1.6);
  // mirador platform
  const m = P2(MIRADOR.x, MIRADOR.z); c.fillStyle = '#6b4423'; c.fillRect(m[0] - 2.5, m[1] - 2.5, 5, 5);
  // route landmarks
  const dot = (x, z, r, col) => { const q = P2(x, z); c.beginPath(); c.arc(q[0], q[1], r, 0, Math.PI * 2); c.fillStyle = col; c.fill(); };
  if (LV.id === 'bunol') {
    for (let z = 270; z < 322; z += 7) dot(cx(z) + wallStart(z) - 6, z, 1.6, '#f4f1ea');
    dot(LV.cave.x, LV.cave.z, 3.2, '#3a2c24'); dot(LV.bus.x, LV.bus.z, 2.6, '#1F4D3A');
    const k = P2(cx(300) - wallStart(300) - 16, 300); c.fillStyle = '#9a8468'; c.fillRect(k[0] - 2, k[1] - 2, 4, 4);
  }
  if (LV.id === 'waterfall') { dot(LV.cairn.x, LV.cairn.z, 2, '#6b6158'); dot(LV.view.x, LV.view.z, 2.4, '#6b4423'); }
}
function toggleMap() { mapBig = !mapBig; $('map').classList.toggle('big', mapBig); }
function drawMap() {
  const cv = $('map'); if (!mapBG || !cv.offsetWidth) return;
  const dpr = Math.min(2, devicePixelRatio || 1), w = Math.round(cv.clientWidth * dpr), h = Math.round(cv.clientHeight * dpr);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }

    c.fillStyle = done ? '#fff' : '#143628'; c.font = `700 ${Math.round(sz * 1.25)}px -apple-system, Segoe UI, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(done ? '✓' : String(i + 1), x, y + .5 * dpr);
    if (mapBig) { const t = (st.find(q => q[0] === p.id) || [])[1] || ''; c.font = `600 ${Math.round(10.5 * dpr)}px -apple-system, Segoe UI, sans-serif`; c.textAlign = x > w * .55 ? 'right' : 'left';
      const tx = x + (x > w * .55 ? -1 : 1) * (sz + 4 * dpr); c.lineWidth = 3 * dpr; c.strokeStyle = 'rgba(20,54,40,.75)'; c.strokeText(t, tx, y); c.fillStyle = '#fff'; c.fillText(t, tx, y); }
  });
  // player arrow (top of the map = upstream / start)
  const [px, py] = P2(S.x, S.z), a = Math.atan2(Math.sin(S.face), Math.cos(S.face)), r = (mapBig ? 9 : 6.5) * dpr;
  c.save(); c.translate(px, py); c.rotate(-a);
  c.beginPath(); c.moveTo(0, r); c.lineTo(r * .65, -r * .6); c.lineTo(0, -r * .25); c.lineTo(-r * .65, -r * .6); c.closePath();

}
