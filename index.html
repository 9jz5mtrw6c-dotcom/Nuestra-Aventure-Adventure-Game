<style>

  .vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 48%, transparent 58%, rgba(10, 14, 12, .26) 100%); }

  /* Subtle optical finish: natural contrast, atmospheric edge falloff and a restrained film grain. */
  body::after { content:""; position:fixed; inset:0; z-index:2; pointer-events:none;
    background: radial-gradient(ellipse at 50% 46%, transparent 48%, rgba(9,20,15,.16) 100%),
                linear-gradient(180deg, rgba(255,235,205,.035), transparent 28%, transparent 78%, rgba(7,18,13,.13));
    box-shadow: inset 0 0 110px rgba(8,18,12,.14); }

  #bAct { display:none; background: var(--terra); color:#fff; }

  /* puzzles */

<div class="vig"></div>
<div class="loading serif" id="loading"><div class="ld"><img class="lg-load" data-logo="big" alt="Nuestra Aventura – Adventure Game"><span id="loadingT">Nuestra Aventura…</span></div></div>

  <div class="tr">

/* ------------------------------------------------------------------ math */
const M4 = {
  ident: () => { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  persp(fov, a, n, f) { const t = 1 / Math.tan(fov / 2), m = new Float32Array(16); m[0] = t / a; m[5] = t; m[10] = (f + n) / (n - f); m[11] = -1; m[14] = 2 * f * n / (n - f); return m; },
  look(e, c, u) {
    let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2]; let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
    let xx = u[1] * zz - u[2] * zy, xy = u[2] * zx - u[0] * zz, xz = u[0] * zy - u[1] * zx; l = Math.hypot(xx, xy, xz); xx /= l; xy /= l; xz /= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    return new Float32Array([xx, yx, zx, 0, xy, yy, zy, 0, xz, yz, zz, 0, -(xx * e[0] + xy * e[1] + xz * e[2]), -(yx * e[0] + yy * e[1] + yz * e[2]), -(zx * e[0] + zy * e[1] + zz * e[2]), 1]);
  },
  mul(a, b) { const o = new Float32Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k]; o[i * 4 + j] = s; } return o; },
  // model matrix from translation, yaw (Y), pitch (X local), scale
  trs(tx, ty, tz, ry, rx, sx, sy, sz) {
    const cy = Math.cos(ry), sy_ = Math.sin(ry), cx = Math.cos(rx), sx_ = Math.sin(rx);
    // R = Ry * Rx
    return new Float32Array([
      cy * sx, 0, -sy_ * sx, 0,
      sy_ * sx_ * sy, cx * sy, cy * sx_ * sy, 0,
      sy_ * cx * sz, -sx_ * sz, cy * cx * sz, 0,
      tx, ty, tz, 1]);
  }
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a + (b - a) * t;

/* --------------------------------------------------------------- noise */
function hash(x, y) { let h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return mix(mix(hash(xi, yi), hash(xi + 1, yi), u), mix(hash(xi, yi + 1), hash(xi + 1, yi + 1), u), v);
}
function fbm(x, y) { let s = 0, a = .5, f = 1; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= .5; } return s; }
let seed = 1; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

/* ============================================================== WORLD
   The canyon runs along +Z (downstream). River centre: cx(z).
   Waterfalls: sharp drops of the river, while the banks ramp down gently
   so you can walk down beside them.                                     */
const Z0 = 0, XW = 150;
let Z1 = 620, LV = null, FALLS = [], BRIDGE = null, RAMP = null, MIRADOR = null, ABSEIL = null, SLIDE = null, DECK = null;
let PZ = {}, LETTERS = {}, ICON = {};
function cx(z) { return LV.cxA * Math.sin(z * 0.011 + LV.cxP) + 7 * Math.sin(z * 0.029 + 1.3); }
function gorgeAmt(z) { const G = LV.gorge; return G ? smooth(G.z0 - 8, G.z0 + 4, z) * (1 - smooth(G.z1 - 4, G.z1 + 8, z)) : 0; }
function riverW(z) {
  let w = LV.rw; for (const f of FALLS) w += (f.wide ?? 7) * smooth(f.z - 2, f.z + 8, z) * (1 - smooth(f.z + 22, f.z + 40, z));
  if (LV.lake) w += LV.lake.w * (1 - smooth(LV.lake.z1 - 8, LV.lake.z1, z));
  if (LV.bay) w += LV.bay.w * smooth(LV.bay.z0, LV.bay.z0 + 50, z);
  return LV.gorge ? mix(w, LV.gorge.w, gorgeAmt(z)) : w;
}
function baseSharp(z) { let b = 0; for (const f of FALLS) b -= f.drop * smooth(f.z - 0.6, f.z + 0.6, z); return b; }
function baseSmooth(z) { let b = 0; for (const f of FALLS) b -= f.drop * smooth(f.z - 14, f.z + 16, z); return b; }
function waterY(z) { return CAVE_ON ? caveWater() : LV.coast ? LV.seaY + TIDE.h : baseSharp(z) - 0.55; }
function wallStart(z) { const ws = Math.max(24 + 5 * Math.sin(z * 0.043) + 3 * Math.sin(z * 0.11), riverW(z) + 15); return LV.gorge ? mix(ws, riverW(z) + .3, gorgeAmt(z)) : ws; }
function rampAmt(x, z) { return (Math.sign(x - cx(z)) === RAMP.side) ? smooth(RAMP.z0, RAMP.z0 + 25, z) * (1 - smooth(RAMP.z1 - 25, RAMP.z1, z)) : 0; }

function height(x, z) {
  if (CAVE_ON) return caveGround(x, z);
  if (LV.heightFn) return LV.heightFn(x, z);
  const c = cx(z), d = Math.abs(x - c), rw = riverW(z);
  const pool = FALLS.reduce((a, f) => a + 2.2 * smooth(f.z, f.z + 6, z) * (1 - smooth(f.z + 20, f.z + 34, z)), 0);
  const bed = baseSharp(z) - (LV.depth ? LV.depth(z) : 2.4) - pool;
  const bank = baseSmooth(z) + 0.55 + 0.035 * (d - rw) + 0.35 * fbm(x * .12, z * .12);
  let h = mix(bed, bank, smooth(rw - 2.5, rw + 1.5, d));

  let w = smooth(ws, ws + width, d);
  w = mix(w, Math.pow(w, 1.15), 1 - ramp);
  h += w * wallH;
  // ledges & rock texture on the walls
  h += (1 - ramp) * smooth(ws - 2, ws + 4, d) * (1 - smooth(ws + width, ws + width + 10, d)) * 3.5 * (fbm(x * .3, z * .3) - .5);
  // rim plateau undulation
  h += smooth(ws + width, ws + width + 20, d) * 6 * (fbm(x * .03, z * .03) - .3);
  { const sd = x > c ? 1 : -1, rf = fbm(z * .018 + sd * 11.3, sd * 5.1 + x * .004), rg = 1 - Math.abs(2 * rf - 1);
    h += (1 - ramp) * (1 - gA) * smooth(ws + width - 3, ws + width + 2, d) * (1 - smooth(ws + width + 6, ws + width + 18, d)) * (1.5 + 9 * rg * rg); }
  for (const f of FALLS) if (f.drop >= 2.5) {
    const k = smooth(f.z - .8, f.z + 1.2, z) * (1 - smooth(f.z + 9, f.z + 17, z)) * (1 - smooth(rw + .8, rw + 3.6, d));
    if (k > 0) h = Math.min(h, mix(h, baseSharp(z) - 2.6, k));
  }
  h += mountainH(x, z);
  // close the canyon at both ends
  h += 50 * (1 - smooth(Z0 - 10, Z0 + 14, z)) * smooth(4, 20, d) + 60 * smooth(Z1 - 18, Z1, z);
  return h;
}

// x on the wall surface at height y (wall height decreases towards the river)
function wallX(y) {
  let lo = ABSEIL.lo, hi = ABSEIL.hi;
  for (let i = 0; i < 22; i++) { const m = (lo + hi) / 2; if (height(m, ABSEIL.z) > y) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
function onDeck(x, z) {
  const dx = DECK.xb - DECK.xa, dz = DECK.zb - DECK.za, L2 = dx * dx + dz * dz;
  const t = ((x - DECK.xa) * dx + (z - DECK.za) * dz) / L2;
  if (t < -.02 || t > 1) return false;
  return Math.hypot(x - (DECK.xa + dx * t), z - (DECK.za + dz * t)) < DECK.w;
}

    const sw = Math.sin(S.t * 2.4), sd = S.face + Math.PI / 2, hx = S.x + Math.sin(sd) * .35, hz = S.z + Math.cos(sd) * .35;
    cyl([hx, S.y + 1.55, hz], [hx + Math.sin(S.face) * sw * .9 + Math.sin(sd) * .5, wy - .3, hz + Math.cos(S.face) * sw * .9 + Math.cos(sd) * .5], .02, [.2, .2, .22]); }

  common(P.water, VP); bindMesh(water); gl.drawElements(gl.TRIANGLES, water.n, gl.UNSIGNED_INT, 0);

// letters are handed out in a scrambled order so the passport does not simply spell the answer
S.solved = S.solved || {}; S.seen = S.seen || {};
function savePz() { try { localStorage.setItem('avh-solved-' + LV.id, JSON.stringify(S.solved)); localStorage.setItem('avh-seen-' + LV.id, JSON.stringify(S.seen)); } catch (e) {} }
const norm = v => String(v || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/\b(de|het|een|the|a|an|el|la|un|una)\b/g, '').replace(/[^a-z0-9]/g, '');
const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const stampName = id => (T().stamps.find(x => x[0] === id) || [])[1] || '';

let pzOpen = null, pzTimers = [];
function clearPzTimers() { pzTimers.forEach(clearTimeout); pzTimers = []; }
function openPuzzle(id, onSolve) {
  if (pzOpen) return;
  pzOpen = { id, onSolve: onSolve || (() => award(id)) };
  S.seen[id] = true; savePz();
  S.playing = false; S.keys = {};
  const t = T(), p = t.pz[id];
  $('pzEy').textContent = t.stampBox + ' · ' + stampName(id);
  $('pzTitle').textContent = p.t; $('pzStory').textContent = p.s; $('pzClue').textContent = p.c;
  $('pzMsg').textContent = ''; $('pzCheck').style.display = 'none'; $('pzLater').textContent = t.later;
  $('pzCheck').textContent = t.check;
  buildPuzzle(id, $('pzBody'));
  $('pz').classList.remove('gone');
}
function closePuzzle(resume = true) {
  clearPzTimers(); $('pz').classList.add('gone'); pzOpen = null;
  if (resume && $('menu').classList.contains('gone') && $('book').classList.contains('gone')) S.playing = true;
}
function wrong() { const m = $('pzMsg'); m.textContent = T().wrong; m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake'); }
function solvedPuzzle() {
  if (!pzOpen) return;
  const { id, onSolve } = pzOpen, t = T();
  S.solved[id] = true; savePz(); clearPzTimers(); chirp(); setTimeout(chirp, 140); setTimeout(chirp, 300);
  const L = LETTERS[id];
  $('pzCheck').style.display = 'none'; $('pzMsg').textContent = '';
  $('pzBody').innerHTML = `<div class="pz-solved"><b>${esc(t.solved)}</b>${L ? `<p>${esc(t.letterGot)}</p><div class="tile big">${L}</div>` : ''}</div>`;
  $('pzLater').textContent = t.next;
  $('pzLater').onclick = () => { $('pzLater').onclick = () => closePuzzle(); closePuzzle(); onSolve(); };
}

function buildPuzzle(id, el) {
  const t = T(), p = t.pz[id], kind = PZ[id].kind;
  $('pzLater').onclick = () => closePuzzle();
  if (kind === 'code') {
    const d = [0, 0, 0];
    el.innerHTML = `<div class="lock">${d.map((_, i) => `<div class="dial"><button data-i="${i}" data-d="1">▲</button><span id="dg${i}">0</span><button data-i="${i}" data-d="-1">▼</button></div>`).join('')}</div>`;
    el.querySelectorAll('button').forEach(b => b.onclick = () => { const i = +b.dataset.i; d[i] = (d[i] + +b.dataset.d + 10) % 10; $('dg' + i).textContent = d[i]; $('pzMsg').textContent = ''; });
    $('pzCheck').style.display = ''; $('pzCheck').onclick = () => d.join('') === PZ[id].answer ? solvedPuzzle() : wrong();
  } else if (kind === 'text') {
    let extra = '';
    if (PZ[id].cipher) extra = `<div class="cipher">${esc(p.code)}</div>`;
    if (PZ[id].final) {
      const got = Object.keys(LETTERS).filter(k => S.solved[k]).map(k => LETTERS[k]);
      const shuffled = got.map((l, i) => [l, Math.sin(i * 12.9898 + 4.1)]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
      extra = `<p class="small">${esc(t.letters)}</p><div class="tiles">${shuffled.map(l => `<div class="tile">${l}</div>`).join('') || '–'}</div>`;
    }
    el.innerHTML = `${extra}<input id="pzIn" class="pz-in" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="20">`;
    const inp = $('pzIn'), check = () => PZ[id].answers.includes(norm(inp.value)) ? solvedPuzzle() : wrong();
    inp.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') check(); };
    $('pzCheck').style.display = ''; $('pzCheck').onclick = check;
    setTimeout(() => { try { inp.focus(); } catch (e) {} }, 60);
  } else if (kind === 'simon') {
    const cols = ['#D9774B', '#2BA8A4', '#E8C95B', '#7DA05C'], seq = [];
    for (let i = 0; i < (PZ[id].len || 5); i++) seq.push(Math.floor(Math.random() * 4));
    el.innerHTML = `<p class="small" id="smHint"></p><div class="planks">${cols.map((c, i) => `<button class="plank" data-i="${i}" style="--c:${c}"></button>`).join('')}</div>`;
    const btns = [...el.querySelectorAll('.plank')]; let pos = 0, busy = true;
    const flash = (i, ms = 420) => { btns[i].classList.add('lit'); pzTimers.push(setTimeout(() => btns[i].classList.remove('lit'), ms)); };
    const play = () => {
      busy = true; pos = 0; $('smHint').textContent = t.simonWatch;
      seq.forEach((v, k) => pzTimers.push(setTimeout(() => { flash(v); chirp(); }, 700 + k * 650)));
      pzTimers.push(setTimeout(() => { busy = false; $('smHint').textContent = t.simonGo; }, 700 + seq.length * 650));
    };
    btns.forEach(b => b.onclick = () => {
      if (busy) return; const i = +b.dataset.i; flash(i, 220);
      if (i !== seq[pos]) { wrong(); pzTimers.push(setTimeout(play, 900)); return; }
      if (++pos === seq.length) pzTimers.push(setTimeout(solvedPuzzle, 350));
    });
    play();
  } else if (kind === 'pipes') {
    // 3x3 stone channel. Openings as bits: N=1 E=2 S=4 W=8. Base I = N|S, L = N|E.
    const rot = (m, r) => { for (let k = 0; k < r; k++) m = ((m << 1) | (m >> 3)) & 15; return m; };
    const sol = { '0,1': ['I', 0], '1,1': ['L', 0], '1,2': ['L', 2], '2,2': ['L', 3], '2,1': ['L', 1] };
    const cells = [];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
      const s = sol[r + ',' + c], type = s ? s[0] : ((r * 3 + c) % 2 ? 'I' : 'L');
      const rr = s ? (s[1] + 1 + ((r + c) % 3)) % 4 : (r * 2 + c) % 4;
      cells.push({ r, c, type, rot: rr });
    }
    const mask = cl => rot(cl.type === 'I' ? 5 : 3, cl.rot);
    const trace = () => {   // follow the water from the top inlet of (0,1)
      let r = 0, c = 1, enter = 1; const wet = new Set();
      for (let n = 0; n < 12; n++) {
        if (r < 0 || r > 2 || c < 0 || c > 2) return { wet, ok: false };
        const m = mask(cells[r * 3 + c]); if (!(m & enter)) return { wet, ok: false };
        wet.add(r * 3 + c); const out = m & ~enter;
        if (out === 4 && r === 2 && c === 1) return { wet, ok: true };
        if (out === 1) { r--; enter = 4; } else if (out === 2) { c++; enter = 8; } else if (out === 4) { r++; enter = 1; } else { c--; enter = 2; }
      }
      return { wet, ok: false };
    };
    const svg = (cl, wet) => {
      const m = mask(cl), col = wet ? '#2BA8A4' : '#b9ab90', arm = (x2, y2) => `<line x1="30" y1="30" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="14" stroke-linecap="round"/>`;
      return `<svg viewBox="0 0 60 60" width="100%" height="100%"><rect x="2" y="2" width="56" height="56" rx="8" fill="#7d6b58"/>${m & 1 ? arm(30, 0) : ''}${m & 2 ? arm(60, 30) : ''}${m & 4 ? arm(30, 60) : ''}${m & 8 ? arm(0, 30) : ''}<circle cx="30" cy="30" r="7" fill="${col}"/></svg>`;
    };
    const draw = () => {
      const { wet, ok } = trace();
      el.innerHTML = `<p class="small">${esc(t.pipesHint)}</p><div class="pipes-wrap"><div class="inlet">▼</div><div class="pipes">${cells.map((cl, i) => `<button data-i="${i}">${svg(cl, wet.has(i))}</button>`).join('')}</div><div class="outlet">▼</div></div>`;
      el.querySelectorAll('.pipes button').forEach(b => b.onclick = () => { cells[+b.dataset.i].rot = (cells[+b.dataset.i].rot + 1) % 4; draw(); });
      if (ok) pzTimers.push(setTimeout(solvedPuzzle, 500));
    };
    draw();
  } else if (kind === 'order') {
    const steps = p.steps, order = steps.map((s, i) => i).sort((a, b) => Math.sin(a * 7.3 + 1) - Math.sin(b * 7.3 + 1));
    let picked = [];
    const draw = () => {
      el.innerHTML = `<p class="small">${esc(t.orderHint)}</p><div class="steps">${order.map(i => { const n = picked.indexOf(i);
        return `<button data-i="${i}" class="${n >= 0 ? 'on' : ''}"><span>${n >= 0 ? n + 1 : ''}</span>${esc(steps[i])}</button>`; }).join('')}</div>`;
      el.querySelectorAll('.steps button').forEach(b => b.onclick = () => {
        const i = +b.dataset.i; if (picked.includes(i)) return;
        picked.push(i);
        if (i !== picked.length - 1) { wrong(); picked = []; pzTimers.push(setTimeout(draw, 650)); draw(); return; }
        $('pzMsg').textContent = ''; draw(); if (picked.length === steps.length) pzTimers.push(setTimeout(solvedPuzzle, 400));
      });
    };
    draw();
  } else if (kind === 'choice') {
    el.innerHTML = `<div class="steps">${p.opts.map((o, i) => `<button data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
    el.querySelectorAll('.steps button').forEach(b => b.onclick = () => +b.dataset.i === PZ[id].correct ? solvedPuzzle() : wrong());
  }
}
