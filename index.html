<title>Nuestra Aventura · Adventure Game</title>
<style>
  :root { --forest:#1F4D3A; --deep:#143628; --turq:#2BA8A4; --sand:#E8D5B0; --white:#FBF8F2; --terra:#D9774B; --paper:#F3E7CF; --ink:#3a2c1e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F3C9A2; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif; color: #fff; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; filter: saturate(1.08) contrast(1.04); }
  body::after { content:""; position:fixed; inset:0; z-index:2; pointer-events:none; background: radial-gradient(ellipse at 50% 46%, transparent 52%, rgba(9,20,15,.16) 100%); }
  .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif; }
  .hud { position: fixed; inset: 0; pointer-events: none; transition: opacity .4s; z-index: 3; }
  .hud.hide { opacity: 0; }
  .hud > * { pointer-events: auto; }
  .panel { background: rgba(20, 54, 40, .58); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.18); border-radius: 18px; }
  .tl { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left)); padding: 10px 14px; }
  .tl b { display: block; font-size: 15px; }
  .tl small { display: block; font-size: 11px; opacity: .8; letter-spacing: .12em; text-transform: uppercase; }
  .stamps { display: flex; gap: 4px; margin-top: 5px; }
  .stamps i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px dashed rgba(232,213,176,.7); }
  .stamps i.on { background: var(--terra); border: 1.5px solid #fff; }
  .stamps i.adv { border-color: #9fd9d6; }
  .stamps i.adv.on { background: var(--turq); }
  .tr { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); display: flex; gap: 8px; }
  .btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; border: 1px solid rgba(255,255,255,.2); background: rgba(20,54,40,.58); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); cursor: pointer; position: relative; }
  .btn svg { width: 22px; height: 22px; }
  .btn .dot { position: absolute; top: 6px; right: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--terra); border: 2px solid #fff; display: none; }
  .btn.new .dot { display: block; }
  .compass { position: absolute; top: calc(70px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); padding: 7px 14px; font-size: 13px; display: flex; gap: 8px; align-items: center; white-space: nowrap; max-width: calc(100vw - 24px); overflow: hidden; text-overflow: ellipsis; }
  .compass .arrow { width: 22px; height: 22px; display: grid; place-items: center; color: var(--sand); flex: none; }
  .chapter { position: absolute; top: calc(112px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--sand); text-shadow: 0 1px 6px rgba(0,0,0,.5); white-space: nowrap; pointer-events: none; }
  @media (max-width: 640px) { .compass { top: calc(92px + env(safe-area-inset-top)); font-size: 12px; } .chapter { top: calc(132px + env(safe-area-inset-top)); } }
  .toast { position: absolute; left: 50%; top: 21%; transform: translate(-50%, -10px); text-align: center; padding: 14px 20px; opacity: 0; transition: all .4s; pointer-events: none; max-width: 88vw; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast .k { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--sand); }
  .toast h2 { margin: 4px 0; font-size: 24px; font-weight: 600; }
  .toast p { margin: 0; font-size: 14px; opacity: .92; }
  .prompt { position: absolute; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 10px 16px; font-size: 14px; display: none; align-items: center; gap: 10px; white-space: nowrap; cursor: pointer; }
  .prompt.show { display: flex; }
  .prompt kbd { font: 700 12px/1 inherit; font-family: inherit; background: var(--sand); color: var(--deep); border-radius: 6px; padding: 4px 8px; }
  body.touch .prompt { bottom: calc(170px + env(safe-area-inset-bottom)); }
  body.touch .prompt kbd { display: none; }
  .joy { position: absolute; left: calc(22px + env(safe-area-inset-left)); bottom: calc(22px + env(safe-area-inset-bottom)); width: 130px; height: 130px; border-radius: 50%; background: rgba(20,54,40,.35); border: 1.5px solid rgba(255,255,255,.3); display: none; touch-action: none; }
  .joy i { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(251,248,242,.85); box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .acts { position: absolute; right: calc(22px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); display: none; gap: 12px; align-items: flex-end; }
  .act { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 11px; letter-spacing: .04em; color: var(--deep); background: rgba(232,213,176,.92); border: 2px solid #fff; box-shadow: 0 6px 18px rgba(0,0,0,.25); touch-action: none; }
  .act.small { width: 54px; height: 54px; background: rgba(251,248,242,.85); }
  .act.on { background: var(--terra); color: #fff; }
  .act.use { background: var(--turq); color: #fff; display: none; }
  .act.use.show { display: grid; }
  body.touch .joy { display: block; }
  body.touch .acts { display: flex; }
  .keys { position: absolute; left: 12px; bottom: 12px; padding: 8px 12px; font-size: 12px; opacity: .85; }
  body.touch .keys { display: none; }
  /* abseil HUD */
  .rap { position: absolute; right: calc(16px + env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); width: 64px; padding: 12px 8px; display: none; flex-direction: column; align-items: center; gap: 8px; font-size: 11px; text-align: center; }
  .rap.show { display: flex; }
  .rap .bar { width: 10px; height: 160px; border-radius: 6px; background: rgba(255,255,255,.18); position: relative; overflow: hidden; }
  .rap .bar i { position: absolute; left: 0; right: 0; top: 0; background: linear-gradient(var(--sand), var(--turq)); border-radius: 6px; }
  .rap .spd { width: 44px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
  .rap .spd i { display: block; height: 100%; width: 0; background: var(--turq); transition: width .15s, background .15s; }
  .rap .spd i.fast { background: #e0563a; }
  body.touch .rap { right: auto; left: calc(14px + env(safe-area-inset-left)); top: 40%; }
  .rapctl { position: absolute; right: calc(22px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); display: none; gap: 10px; align-items: flex-end; }
  body.touch .rapctl.show { display: flex; }
  body.touch.raping .acts { display: none; }
  .choice { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); width: min(420px, 92vw); padding: 16px; display: none; text-align: center; }
  .choice.show { display: block; }
  .choice h3 { margin: 0 0 4px; font-size: 18px; }
  .choice p { margin: 0 0 12px; font-size: 13px; opacity: .9; }
  .choice button { display: block; width: 100%; margin-top: 8px; min-height: 48px; border-radius: 14px; border: 1.5px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  .choice button:hover { background: rgba(255,255,255,.22); }
  /* overlays */
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(circle at 70% 20%, rgba(43,168,164,.35), transparent 55%), rgba(20,54,40,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 10; transition: opacity .4s; }
  .overlay.gone { opacity: 0; pointer-events: none; }
  .card { width: min(540px, 100%); max-height: 90vh; overflow: auto; background: var(--white); color: #1D2A24; border-radius: 26px; padding: 24px 22px; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
  .card .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #1F8F8C; }
  .card h1 { font-size: 30px; line-height: 1.05; margin: 8px 0 10px; color: var(--deep); font-weight: 600; }
  .card h1 em { color: var(--terra); }
  .card p { margin: 0 0 12px; font-size: 15px; line-height: 1.5; color: #3b4a42; }
  .ctrl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13.5px; margin: 14px 0 16px; padding: 14px; background: #F4EBDD; border-radius: 16px; }
  .ctrl kbd { font-family: inherit; font-weight: 700; font-size: 12px; line-height: 1; background: #fff; border: 1px solid rgba(31,77,58,.2); border-bottom-width: 2px; border-radius: 6px; padding: 4px 7px; color: var(--forest); white-space: nowrap; }
  .go { width: 100%; min-height: 52px; border: 0; border-radius: 999px; background: var(--forest); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(31,77,58,.3); }
  .go:disabled { opacity: .4; cursor: not-allowed; }
  .go.wa { background: #1FAF5B; margin-top: 10px; display: flex; align-items: center; justify-content: center; text-decoration: none; }
  .go.ghost { background: transparent; color: var(--forest); box-shadow: none; border: 1.5px solid rgba(31,77,58,.2); margin-top: 10px; }
  .langs { display: flex; gap: 6px; margin-bottom: 14px; }
  .langs button { border: 1.5px solid rgba(31,77,58,.18); background: #fff; color: var(--forest); border-radius: 99px; padding: 6px 12px; font-weight: 700; font-size: 12px; cursor: pointer; }
  .langs button.on { background: var(--forest); color: #fff; border-color: var(--forest); }
  .fine { font-size: 11.5px !important; color: #6b776f !important; margin-top: 12px !important; }
  .stamp-list { display: grid; gap: 6px; margin: 12px 0; }
  .stamp-list div { display: flex; gap: 10px; align-items: center; font-size: 14px; }
  .stamp-list span { width: 22px; height: 22px; border-radius: 50%; border: 2px dashed #D9774B; flex: none; display: grid; place-items: center; color: #fff; font-size: 12px; }
  .stamp-list .on span { background: #D9774B; border-style: solid; }
  .stamp-list .adv span { border-color: #2BA8A4; } .stamp-list .adv.on span { background: #2BA8A4; }
  /* gear rack */
  .gear-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
  @media (max-width: 420px) { .gear-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .gear { border: 2px solid rgba(31,77,58,.14); background: #fff; border-radius: 16px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--deep); cursor: pointer; min-height: 96px; text-align: center; }
  .gear svg { width: 40px; height: 40px; }
  .gear.on { border-color: var(--turq); background: #E4F4F2; }
  .gear.bad { border-color: #e0563a; background: #FBE9E4; animation: shake .4s; }
  @keyframes shake { 0%,100% { transform: none } 25% { transform: translateX(-5px) } 75% { transform: translateX(5px) } }
  .checklist { display: grid; gap: 6px; margin: 10px 0 14px; }
  .checklist label { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: #F4EBDD; font-size: 14px; cursor: pointer; }
  .checklist input { width: 20px; height: 20px; accent-color: #1F4D3A; }
  .msg { min-height: 20px; font-size: 13px !important; color: #b4462c !important; }
  /* notebook */
  .notebook { width: min(560px, 100%); max-height: 90vh; overflow: auto; border-radius: 10px 22px 22px 10px; padding: 26px 24px 20px 34px; color: var(--ink); position: relative;
    background: repeating-linear-gradient(180deg, transparent 0 29px, rgba(140,106,69,.16) 29px 30px), linear-gradient(135deg, #F7ECD5, #EEDDBC); box-shadow: 0 30px 80px rgba(0,0,0,.4), inset 6px 0 0 rgba(120,80,40,.25); }
  .notebook::before { content: ''; position: absolute; left: 22px; top: 0; bottom: 0; width: 2px; background: rgba(217,119,75,.35); }
  .notebook .who { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #8c6a45; }
  .notebook h2 { font-family: 'Iowan Old Style', Georgia, serif; font-size: 26px; margin: 6px 0 10px; color: #3a2c1e; }
  .notebook p { font-family: 'Iowan Old Style', Georgia, serif; font-style: italic; font-size: 17px; line-height: 30px; margin: 0 0 12px; }
  .notebook .code { font-style: normal; font-weight: 700; letter-spacing: .12em; display: inline-block; border: 2px solid #b4462c; color: #b4462c; padding: 4px 10px; border-radius: 6px; transform: rotate(-3deg); }
  .notebook svg.sketch { width: 100%; height: 150px; margin: 4px 0 10px; }
  .nb-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; color: #8c6a45; }
  .nb-nav button { border: 1.5px solid rgba(120,80,40,.3); background: rgba(255,255,255,.4); color: #3a2c1e; border-radius: 99px; padding: 8px 14px; font-weight: 700; cursor: pointer; }
  .nb-nav button:disabled { opacity: .3; }
  .nb-close { position: absolute; top: 12px; right: 14px; border: 0; background: none; font-size: 22px; color: #8c6a45; cursor: pointer; }
  .photo-hint { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); padding: 8px 16px; font-size: 13px; display: none; z-index: 5; }
  body.photo .photo-hint { display: block; }
  #err { display: none; }

/* ===================================================== GROUND & COLLISION */
function groundAt(x, z, y) {
  let h = height(x, z);
  if (Math.abs(z - BRIDGE.z) < BRIDGE.w && Math.abs(x - cx(BRIDGE.z)) < BRIDGE.half + .3) { const by = bridgeY(x); if (y === undefined || y > by - .6) h = Math.max(h, by); }
  if (Math.abs(x - MIRADOR.x) < 3.5 && Math.abs(z - MIRADOR.z) < 3.5) h = Math.max(h, MIRADOR.y + .3);
  for (const c of COLLIDERS) if (c.top !== undefined && Math.abs(c.z - z) < c.r && Math.hypot(c.x - x, c.z - z) < c.r * .8 && (y === undefined || y > c.top - .5)) h = Math.max(h, c.top);
  return h;
}
function ceilingAt(x, z) { for (const c of CEIL) if (z > c.z0 && z < c.z1 && x > c.x0 && x < c.x1) return c.y; return Infinity; }
function blocked(x, z, y) {
  if (z < Z0 + 3 || z > Z1 - 3 || Math.abs(x - cx(z)) > XW - 3) return true;
  if (!geared() && z > CAN.z0 - 1 && z < CAN.z1 + 4 && S.z <= CAN.z0 - 1) { toastOnce('gate', 'Alba', T().gate, '', 3000); return true; }
  if (z > CAN.lip - .25 && z < CAN.lip + 1.7 && canyonAmt(z) > .5 && S.mode !== 'rappel' && S.z < CAN.lip) { toastOnce('lip', '', T().lip, '', 2600); return true; }
  if (ceilingAt(x, z) - y < 1.05) return true;
  const g = groundAt(x, z, y), h = height(x, z);
  const onDeck = Math.abs(x - MIRADOR.x) < 3.6 && Math.abs(z - MIRADOR.z) < 3.6;
  if (g - y > (onDeck ? 3.5 : 0.7)) return true;
  if (Math.abs(g - h) < 0.01 && g > y - 0.05) { const ny = normalAt(x, z)[1], nearWater = Math.abs(x - cx(z)) < riverW(z) + 4; if (ny < (nearWater ? 0.4 : 0.62)) return true; }
  for (const c of COLLIDERS) if (Math.abs(c.z - z) < 2.5 && Math.hypot(c.x - x, c.z - z) < c.r + .3 && (c.top === undefined || y < c.top - .3)) return true;
  return false;
}

/* ================================================================ POSES
   Joint angles (radians). Sign convention: hip/shoulder > 0 swings the limb
   backwards, < 0 forwards; knee > 0 bends; elbow < 0 bends forward.       */
const KEYS = ['pY', 'body', 'lean', 'head', 'lSh', 'lSo', 'lEl', 'rSh', 'rSo', 'rEl', 'lHip', 'lKn', 'lFt', 'rHip', 'rKn', 'rFt', 'roll'];
const Z = () => Object.fromEntries(KEYS.map(k => [k, 0]));
function targetPose(dt) {
  const p = Z(), ph = S.anim, sp = S.speed, t = S.t;
  p.lSo = p.rSo = .08; p.lEl = p.rEl = -.15;
  const gait = (amp, kneeAmp, armAmp, elbow) => {
    const s = Math.sin(ph), c = Math.cos(ph);
    p.lHip = -amp * s; p.rHip = amp * s;
    p.lKn = kneeAmp * Math.max(0, Math.sin(ph + 1.2)) + .08; p.rKn = kneeAmp * Math.max(0, Math.sin(ph + 1.2 + Math.PI)) + .08;
    p.lFt = -p.lHip * .3; p.rFt = -p.rHip * .3;
    p.lSh = armAmp * s; p.rSh = -armAmp * s; p.lEl = p.rEl = elbow;
    p.pY = -Math.abs(c) * .035 * (amp / .45);
  };
  const m = S.mode;
  if (m === 'dress') {
    const u = S.dressT;
    p.head = .45; p.lSh = -.7 + Math.sin(u * 5) * .3; p.rSh = -.6 - Math.sin(u * 5) * .3; p.lEl = p.rEl = -1.7; p.lean = .15; p.lKn = p.rKn = .25; p.pY = -.06;
    if (u > 2.6) { p.lSh = -2.6; p.rSh = -.2; p.lEl = -.4; p.head = -.2; } // thumbs up
    return p;
  }
  if (m === 'prepare') {
    const u = S.prepT;
    p.head = .55; p.lean = .2; p.lSh = -.55; p.rSh = -.75 + Math.sin(u * 6) * .15; p.lEl = -1.75; p.rEl = -1.6; p.lKn = p.rKn = .3; p.pY = -.07;
    if (u > 1.6) { p.head = -.3; p.lSh = -2.5; p.lEl = -.3; p.rSh = .3; p.rEl = -1.1; p.lean = -.15; }
    return p;
  }
  if (m === 'rappel') {
    const R = S.rap, step = R.stepPh;
    p.body = 0; p.lean = -.35 + (R.slip > 0 ? Math.sin(t * 20) * .2 : 0);
    p.lHip = -1.35 + Math.sin(step) * .22; p.rHip = -1.35 - Math.sin(step) * .22;
    p.lKn = .35 + Math.max(0, Math.sin(step)) * .5; p.rKn = .35 + Math.max(0, -Math.sin(step)) * .5;
    p.lFt = p.rFt = -.25;
    p.lSh = -2.55; p.lEl = -.35; p.rSh = .35; p.rEl = -1.05 + (R.vel > .05 ? Math.sin(t * 8) * .1 : 0);
    p.head = .55 + Math.sin(t * .7) * .1; p.roll = R.slip > 0 ? Math.sin(t * 14) * .15 : 0;
    p.pY = 0; return p;
  }
  if (m === 'scramble') {
    const u = S.scr.u;
    p.lean = .7; p.head = -.3;
    if (u < .55) { p.lSh = -2.7; p.rSh = -2.3; p.lEl = -.25; p.rEl = -.5; p.lHip = -1.6; p.lKn = 1.9; p.rHip = .1; p.rKn = .3; }
    else { p.lSh = -.9; p.rSh = -.7; p.lEl = -1.3; p.rEl = -1.4; p.lHip = -.9; p.lKn = 1.2; p.rHip = .5; p.rKn = 1.1; p.lean = .9; }
    p.pY = -.15; return p;
  }
  if (S.swim) {
    const b = Math.sin(ph);
    p.body = 1.35; p.head = -1.05; p.pY = -.12;
    p.lSh = p.rSh = -2.3 + b * .9; p.lSo = p.rSo = .55 + Math.cos(ph) * .55; p.lEl = p.rEl = -.6 - Math.max(0, -b) * .8;
    p.lHip = .15 + Math.sin(ph * 2) * .3; p.rHip = .15 - Math.sin(ph * 2) * .3; p.lKn = .3 + Math.max(0, Math.sin(ph * 2)) * .5; p.rKn = .3 + Math.max(0, -Math.sin(ph * 2)) * .5;
    p.lFt = p.rFt = .9;
    return p;
  }
  if (S.exitT > 0) { p.lHip = -1.4; p.lKn = 1.7; p.rHip = .35; p.rKn = .4; p.lSh = .25; p.rSh = .25; p.lEl = p.rEl = -.6; p.lean = .75; p.pY = -.25; return p; }
  if (!S.onGround) {
    p.lHip = -.75; p.lKn = 1.2; p.rHip = .25; p.rKn = .7; p.lSh = -2.2; p.rSh = -1.9; p.lEl = p.rEl = -.3; p.lean = .1;
    if (S.vy < -2) { p.lHip = -.4; p.rHip = -.2; p.lKn = .4; p.rKn = .5; p.lSh = -1.6; p.rSh = -1.6; p.lSo = p.rSo = .6; }
    return p;
  }
  if (sp < .15) { // idle
    p.lean = .02 + Math.sin(t * 1.6) * .012; p.lSh = .05 + Math.sin(t * 1.6) * .02; p.rSh = .05; p.lEl = p.rEl = -.18; p.head = Math.sin(t * .4) * .08;
    p.lKn = p.rKn = .05;
    if (S.wade) { p.lSo = p.rSo = .35; }
    if (S.crouch) { p.pY = -.42; p.lHip = p.rHip = -1.15; p.lKn = p.rKn = 1.75; p.lFt = p.rFt = .55; p.lean = .75; p.head = -.55; p.lSh = p.rSh = -.4; p.lEl = p.rEl = -1.0; }
    return p;
  }
  if (S.crouch) { gait(.3, .5, .3, -1.0); p.pY = -.42; p.lHip -= 1.0; p.rHip -= 1.0; p.lKn += 1.55; p.rKn += 1.55; p.lFt += .5; p.rFt += .5; p.lean = .8; p.head = -.6; return p; }
  if (S.wade) { gait(.55, 1.25, .25, -.6); p.lSo = p.rSo = .45; p.lean = .14; return p; }
  if (sp > 5.4) { gait(.85, 1.6, 1.0, -1.45); p.lean = .3; p.head = -.25; return p; }      // run
  if (sp > 3.0) { gait(.55, .95, .55, -.45); p.lean = .1; return p; }                     // brisk
  gait(.4, .7, .35, -.25); p.lean = .04; return p;                                          // walk
}
function updatePose(dt) {
  const tgt = targetPose(dt);

  const k = 1 - Math.exp(-dt * (S.mode === 'rappel' ? 8 : 13));
  for (const key of KEYS) S.pose[key] += (tgt[key] - S.pose[key]) * k;

const PAL = { skin: [0.84, 0.64, 0.50], shirt: [0.16, 0.60, 0.59], shirt2: [0.12, 0.46, 0.46], pants: [0.30, 0.33, 0.27], boot: [0.36, 0.25, 0.17], cshoe: [0.10, 0.17, 0.30], pack: [0.80, 0.42, 0.26], hat: [0.90, 0.83, 0.68], hair: [0.22, 0.14, 0.09], helmet: [0.85, 0.25, 0.16], harness: [0.10, 0.10, 0.11], harness2: [0.92, 0.50, 0.15], steel: [0.80, 0.82, 0.84], rope: [0.95, 0.62, 0.15], eye: [0.08, 0.07, 0.06] };

/* ============================================================ RENDER */
