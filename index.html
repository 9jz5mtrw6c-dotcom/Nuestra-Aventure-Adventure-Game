<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1F4D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Nuestra Aventura · El Cañón Escondido — V16 · alle 8 routes</title>
<style>
  :root { --forest:#1F4D3A; --deep:#143628; --turq:#2BA8A4; --sand:#E8D5B0; --white:#FBF8F2; --terra:#D9774B; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F3C9A2; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif; color: #fff; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif; }
  .hud { position: fixed; inset: 0; pointer-events: none; transition: opacity .4s; }
  .hud.hide { opacity: 0; }
  .hud > * { pointer-events: auto; }
  .panel { background: rgba(20, 54, 40, .55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.18); border-radius: 18px; }
  .tl { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; }
  .tl b { display: block; font-size: 15px; letter-spacing: .02em; }
  .tl small { display: block; font-size: 11px; opacity: .8; letter-spacing: .12em; text-transform: uppercase; }
  .stamps { display: flex; gap: 4px; margin-top: 4px; }
  .stamps i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px dashed rgba(232,213,176,.7); }
  .stamps i.on { background: var(--terra); border: 1.5px solid #fff; }
  .tr { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 12px; display: flex; gap: 8px; }
  .btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; border: 1px solid rgba(255,255,255,.2); background: rgba(20,54,40,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); cursor: pointer; font-size: 13px; font-weight: 700; }
  .btn svg { width: 22px; height: 22px; }
  .compass { position: absolute; top: calc(70px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); padding: 7px 14px; font-size: 13px; display: flex; gap: 8px; align-items: center; white-space: nowrap; max-width: calc(100vw - 24px); }
  .compass.hard { white-space: normal; text-align: left; max-width: min(560px, calc(100vw - 24px)); }
  .compass.hard small { display: block; font-size: 11px; opacity: .85; margin-top: 1px; }
  .compass.hard .arrow { color: #ff7a5c; }
  .photo { width: 100%; border: 6px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.25); transform: rotate(-1.2deg); border-radius: 2px; display: block; margin: 4px 0 8px; }
  .medal { font-size: 18px; font-weight: 700; color: #1F4D3A; }
  .clue-h { font-weight: 700; color: #1F4D3A; background: #eaf3ee; border-radius: 8px; padding: 6px 9px; }
  .fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .4s; z-index: 40; } .fade.on { opacity: 1; }
  .compass .arrow { width: 22px; height: 22px; display: grid; place-items: center; transition: transform .15s linear; color: var(--sand); }
  @media (max-width: 640px) { .compass { top: calc(92px + env(safe-area-inset-top)); font-size: 12px; } .tl { padding: 8px 12px; } }
  .toast { position: absolute; left: 50%; top: 22%; transform: translate(-50%, -10px); text-align: center; padding: 16px 22px; opacity: 0; transition: all .4s; pointer-events: none; max-width: 86vw; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast .k { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--sand); }
  .toast h2 { margin: 4px 0 4px; font-size: 26px; font-weight: 600; }
  .toast p { margin: 0; font-size: 14px; opacity: .9; }
  .joy { position: absolute; left: calc(22px + env(safe-area-inset-left)); bottom: calc(22px + env(safe-area-inset-bottom)); width: 130px; height: 130px; border-radius: 50%; background: rgba(20,54,40,.35); border: 1.5px solid rgba(255,255,255,.3); display: none; }
  .joy i { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(251,248,242,.85); box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .acts { position: absolute; right: calc(22px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); display: none; gap: 14px; align-items: flex-end; }
  .act { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 12px; letter-spacing: .05em; color: var(--deep); background: rgba(232,213,176,.92); border: 2px solid #fff; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .act.small { width: 56px; height: 56px; background: rgba(251,248,242,.85); }
  .act.on { background: var(--terra); color: #fff; }
  body.touch .joy, body.touch .acts { display: flex; }
  body.touch .joy { display: block; }
  .keys { position: absolute; left: 12px; bottom: 12px; padding: 8px 12px; font-size: 12px; opacity: .85; }
  body.touch .keys { display: none; }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: radial-gradient(circle at 70% 20%, rgba(43,168,164,.35), transparent 55%), rgba(20,54,40,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 10; transition: opacity .5s; }
  .overlay.gone { opacity: 0; pointer-events: none; }
  .card { width: min(520px, 100%); max-height: 92vh; overflow: auto; background: var(--white); color: #1D2A24; border-radius: 28px; padding: 26px 24px; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
  .card .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #1F8F8C; }
  .card h1 { font-size: 32px; line-height: 1.05; margin: 8px 0 10px; color: var(--deep); font-weight: 600; }
  .card h1 em { color: var(--terra); }
  .card p { margin: 0 0 12px; font-size: 15px; line-height: 1.5; color: #3b4a42; }
  .ctrl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13.5px; margin: 14px 0 16px; padding: 14px; background: #F4EBDD; border-radius: 16px; }
  .ctrl kbd { font-family: inherit; font-weight: 700; font-size: 12px; line-height: 1; background: #fff; border: 1px solid rgba(31,77,58,.2); border-bottom-width: 2px; border-radius: 6px; padding: 4px 7px; color: var(--forest); white-space: nowrap; }
  .go { width: 100%; min-height: 54px; border: 0; border-radius: 999px; background: var(--forest); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(31,77,58,.3); }
  .go.ghost { background: transparent; color: var(--forest); box-shadow: none; border: 1.5px solid rgba(31,77,58,.2); margin-top: 10px; }
  .langs { display: flex; gap: 6px; margin-bottom: 14px; }
  .langs button { border: 1.5px solid rgba(31,77,58,.18); background: #fff; color: var(--forest); border-radius: 99px; padding: 6px 12px; font-weight: 700; font-size: 12px; cursor: pointer; }
  .langs button.on { background: var(--forest); color: #fff; border-color: var(--forest); }
  .character-pick { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }
  .character-pick button { border:2px solid rgba(31,77,58,.18); border-radius:15px; background:#F4EBDD; color:var(--deep); padding:12px 8px; font:inherit; cursor:pointer; }
  .character-pick button.on { border-color:var(--terra); background:#fff8ef; box-shadow:0 0 0 2px rgba(217,119,75,.12); }
  .character-pick strong { display:block; font-size:14px; margin-top:4px; }
  .character-pick small { font-size:11px; opacity:.7; }
  .route-pick { display:grid; grid-template-columns:1fr 1fr; gap:5px; margin:6px 0 10px; } .route-pick .rp-t { grid-column:1/-1; }
  .route-pick .rp-t { font-size:12px; font-weight:700; letter-spacing:.06em; color:#1F8F8C; }
  .route-pick button { display:flex; align-items:center; gap:10px; text-align:left; border:2px solid rgba(31,77,58,.18); border-radius:12px; background:#fff; color:var(--deep); padding:5px 8px; font:inherit; font-size:12.5px; line-height:1.2; cursor:pointer; min-height:40px; gap:7px; }
  .route-pick button b { width:22px; height:22px; flex:none; border-radius:50%; background:#F4EBDD; display:grid; place-items:center; font-size:13px; }
  .route-pick button.on { border-color:var(--terra); background:#fff8ef; } .route-pick button.on b { background:var(--terra); color:#fff; }
  .route-pick button:disabled { opacity:.5; cursor:default; } .route-pick small { margin-left:auto; font-size:10px; opacity:.75; white-space:nowrap; } .route-pick button:disabled small { display:none; } .route-pick button:disabled { min-height:34px; }
  .route-pick .more { font-size:12px; color:#6b776f; padding:2px 4px; }
  .fine { font-size: 11.5px !important; color: #6b776f !important; margin-top: 12px !important; }
  .stamp-list { display: grid; gap: 6px; margin: 12px 0; }
  .stamp-list div { display: flex; gap: 10px; align-items: center; font-size: 14px; }
  .stamp-list span { width: 22px; height: 22px; border-radius: 50%; border: 2px dashed #D9774B; flex: none; display: grid; place-items: center; color: #fff; font-size: 12px; }
  .stamp-list .on span { background: #D9774B; border-style: solid; }
  .photo-hint { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); padding: 8px 16px; font-size: 13px; display: none; z-index: 5; }
  body.photo .photo-hint { display: block; }
  #err { display: none; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; background: #1F4D3A; color: var(--sand); z-index: 20; font-size: 18px; transition: opacity .5s; }
  .loading.gone { opacity: 0; pointer-events: none; }
  /* Subtle optical finish: natural contrast, atmospheric edge falloff and a restrained film grain. */
  body::after { content:""; position:fixed; inset:0; z-index:2; pointer-events:none;
    background: radial-gradient(ellipse at 50% 46%, transparent 48%, rgba(9,20,15,.16) 100%),
                linear-gradient(180deg, rgba(255,235,205,.035), transparent 28%, transparent 78%, rgba(7,18,13,.13));
    box-shadow: inset 0 0 110px rgba(8,18,12,.14); }
  canvas { filter: saturate(1.10) contrast(1.045) brightness(1.015); }
  .hud { z-index:3; }
  .photo-hint { z-index:4; }
  /* Map (minimap, tap to enlarge) */
  .minimap { position:absolute; inset:auto; right:12px; filter:none; top:calc(66px + env(safe-area-inset-top)); width:92px; height:216px; padding:0; cursor:pointer; overflow:hidden; display:block; }
  .minimap.big { width:min(300px, 62vw); height:min(690px, calc(100vh - 150px)); }
  @media (max-width: 640px) { .minimap { top:calc(140px + env(safe-area-inset-top)); width:78px; height:184px; } }
  .prompt { position:absolute; left:50%; bottom:calc(120px + env(safe-area-inset-bottom)); transform:translateX(-50%); padding:10px 18px; font-size:14px; font-weight:600; display:none; white-space:nowrap; }
  .prompt.show { display:block; }
  body:not(.touch) .prompt { bottom:58px; }
  #bAct { display:none; background: var(--terra); color:#fff; }
  #bAct.show { display:grid; }
  @media (max-width: 640px) { .tr .btn { width:40px; height:40px; } .tr { gap:6px; } }
  /* puzzles */
  .pzcard { width:min(560px,100%); }
  .clue { background:#f6eedb; border-left:4px solid var(--terra); padding:10px 12px; border-radius:10px; font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif; font-style:italic; color:#3b2f24 !important; }
  .pzmsg { color:#b4452a !important; font-weight:700; min-height:1.4em; margin:8px 0 0 !important; }
  .shake { animation: shake .35s; } @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .row { display:flex; gap:10px; margin-top:10px; } .row .go { margin-top:0; }
  #pzBody { margin-top:10px; }
  #pzBody .small, .bookcard .small { font-size:13px !important; color:#6b776f !important; margin:4px 0 8px !important; }
  .lock { display:flex; gap:12px; justify-content:center; }
  .dial { display:flex; flex-direction:column; align-items:center; background:#1D2A24; border-radius:14px; padding:6px; }
  .dial button { width:54px; height:40px; border:0; border-radius:10px; background:#2e4038; color:#E8D5B0; font-size:16px; cursor:pointer; }
  .dial span { font:700 34px/1.2 ui-monospace, Menlo, monospace; color:#fff; padding:4px 0; }
  .pz-in { width:100%; font-size:20px; padding:12px 14px; border-radius:12px; border:2px solid rgba(31,77,58,.25); text-transform:uppercase; letter-spacing:.12em; font-weight:700; color:var(--deep); background:#fff; }
  .pz-in:focus { outline:3px solid rgba(43,168,164,.4); border-color:var(--turq); }
  .cipher { font:700 26px ui-monospace, Menlo, monospace; letter-spacing:.3em; text-align:center; padding:10px; background:#7d6b58; color:#f6eedb; border-radius:12px; margin-bottom:10px; }
  .cipher.sm { font-size:18px; padding:6px; }
  .planks { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .plank { height:110px; border:3px solid #5b4636; border-radius:8px; background:color-mix(in srgb, var(--c) 45%, #8a6a48); cursor:pointer; transition:transform .1s, filter .1s; }
  .plank.lit { background:var(--c); filter:brightness(1.35); transform:scale(1.05); box-shadow:0 0 22px var(--c); }
  .pipes-wrap { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .inlet, .outlet { color:var(--turq); font-size:20px; line-height:1; }
  .pipes { display:grid; grid-template-columns:repeat(3,76px); gap:4px; }
  .pipes button { width:76px; height:76px; padding:0; border:0; background:none; cursor:pointer; }
  .steps { display:grid; gap:8px; }
  .steps button { text-align:left; min-height:46px; padding:8px 12px; border:2px solid rgba(31,77,58,.18); border-radius:12px; background:#fff; color:var(--deep); font:inherit; font-size:15px; cursor:pointer; display:flex; gap:10px; align-items:center; }
  .steps button span { width:24px; height:24px; flex:none; border-radius:50%; background:#F4EBDD; display:grid; place-items:center; font-weight:800; font-size:13px; }
  .steps button.on { border-color:var(--turq); background:#eaf6f5; } .steps button.on span { background:var(--turq); color:#fff; }
  .pz-solved { text-align:center; } .pz-solved b { font-size:22px; color:var(--forest); display:block; margin-bottom:6px; }
  .tiles { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .tile { width:38px; height:46px; border-radius:8px; background:#1D2A24; color:#E8D5B0; display:grid; place-items:center; font:700 22px ui-monospace, Menlo, monospace; }
  .tile.big { width:64px; height:76px; font-size:40px; margin:8px auto 0; background:var(--terra); color:#fff; }
  .tile.blank { background:#e8e0cf; }
  /* travel book */
  .bookcard { width:min(600px,100%); }
  .bk-top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .bk-top b { font-size:22px; color:var(--deep); }
  .tabs { display:flex; gap:6px; }
  .tabs button { border:1.5px solid rgba(31,77,58,.18); background:#fff; color:var(--forest); border-radius:99px; padding:8px 14px; font-weight:700; font-size:13px; cursor:pointer; min-height:38px; }
  .tabs button.on { background:var(--forest); color:#fff; border-color:var(--forest); }
  .pp-head { display:flex; justify-content:space-between; gap:10px; background:#1F4D3A; color:#E8D5B0; border-radius:14px; padding:12px 14px; margin-bottom:12px; }
  .pp-head small { display:block; font-size:11px; letter-spacing:.08em; opacity:.8; } .pp-head b { font-size:16px; color:#fff; }
  .slots { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; background:#f6eedb; border-radius:14px; padding:12px; margin-bottom:10px;
           background-image:repeating-linear-gradient(0deg, transparent 0 22px, rgba(91,70,54,.07) 22px 23px); }
  @media (max-width:520px) { .slots { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .stamp { aspect-ratio:1; border-radius:50%; border:3px double #b4452a; color:#b4452a; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:6px; background:rgba(217,119,75,.08); }
  .stamp .ico { font-size:26px; line-height:1.1; } .stamp .nm { font-size:10.5px; font-weight:800; line-height:1.15; text-transform:uppercase; letter-spacing:.02em; } .stamp .dt { font-size:10px; margin-top:2px; font-weight:700; }
  .stamp.empty { border:2px dashed rgba(91,70,54,.35); color:rgba(91,70,54,.55); background:none; } .stamp.empty .num { font:700 20px Georgia, serif; }
  .paper { background:#f6eedb; border-radius:14px; padding:16px 18px; min-height:260px; color:#3b2f24; font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;
           background-image:repeating-linear-gradient(0deg, transparent 0 26px, rgba(91,70,54,.09) 26px 27px); box-shadow:inset 0 0 0 1px rgba(91,70,54,.12); }
  .paper h3 { margin:0 0 8px; font-size:22px; color:#143628; } .paper p { color:#3b2f24 !important; font-size:15.5px !important; }
  .paper .hand { font-style:italic; } .paper .muted { opacity:.7; } .paper .ok { color:#1F8F8C !important; font-weight:700; font-family:-apple-system, Segoe UI, sans-serif; }
  .paper .sub { font-weight:700; color:#b4452a !important; margin-top:-4px !important; }
  .paper.final { box-shadow:inset 0 0 0 2px var(--terra); }
  .sketch { width:100%; height:auto; border-radius:10px; margin:4px 0 10px; display:block; }
  .bk-nav { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .bk-nav button { width:48px; height:44px; border-radius:12px; border:1.5px solid rgba(31,77,58,.2); background:#fff; color:var(--forest); font-size:16px; cursor:pointer; }
  .bk-nav button:disabled { opacity:.35; } .bk-nav span { font-size:13px; color:#6b776f; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="loading serif" id="loading">Nuestra Aventura…</div>

<div class="hud" id="hud">
  <div class="tl panel">
    <div><small>Nuestra Aventura</small><b class="serif" id="hudName">El Cañón Escondido</b>
      <div class="stamps" id="stamps"></div></div>
  </div>
  <div class="tr">
    <button class="btn" id="bPhoto" aria-label="Photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <button class="btn" id="bSound" aria-label="Sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10v4h4l5 4V6L8 10z"/><path id="snd" d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg></button>
    <button class="btn" id="bBook" aria-label="Book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5C6.5 4 9.5 4 12 6c2.5-2 5.5-2 8-.5V19c-2.5-1.5-5.5-1.5-8 .5-2.5-2-5.5-2-8-.5z"/><path d="M12 6v13.5"/></svg></button>
    <button class="btn" id="bMenu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div class="compass panel" id="compass"><span class="arrow" id="arrow"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3l6 16-6-4-6 4z"/></svg></span><span id="goal"></span></div>
  <div class="toast panel" id="toast"><div class="k" id="tk"></div><h2 class="serif" id="th"></h2><p id="tp"></p></div>
  <div class="joy" id="joy"><i id="knob"></i></div>
  <div class="acts"><button class="act small" id="bAct">ABSEIL</button><button class="act small" id="bRun">RUN</button><button class="act" id="bJump">JUMP</button></div>
  <canvas class="minimap panel" id="map" aria-label="Map"></canvas>
  <div class="prompt panel" id="prompt"></div>
  <div class="fade" id="fade"></div>
  <div class="keys panel" id="keys"></div>
</div>
<div class="photo-hint panel" id="photoHint"></div>

<div class="overlay" id="intro">
  <div class="card">
    <div class="langs" id="langs"></div>
    <div class="eyebrow">Aventura Virtual Hike</div>
    <h1 class="serif" id="iTitle">Nuestra <em>Aventura</em></h1>
    <div class="route-pick" id="routePick"></div>
    <p id="iLead"></p>
    <div class="character-pick" id="characterPick">
      <button type="button" data-character="man" class="on"><span style="font-size:28px">🧑🏼‍🦱</span><strong>Avonturier</strong><small>Kort blond haar · baardje</small></button>
      <button type="button" data-character="woman"><span style="font-size:28px">👩🏼‍🦱</span><strong>Avonturierster</strong><small>Blonde paardenstaart</small></button>
    </div>
    <div class="ctrl" id="iCtrl"></div>
    <button class="go" id="bStart"></button>
    <p class="fine" id="iFine"></p>
  </div>
</div>

<div class="overlay gone" id="menu">
  <div class="card">
    <div class="eyebrow" id="mEy"></div>
    <h1 class="serif" id="mTitle"></h1>
    <div class="stamp-list" id="mList"></div>
    <button class="go" id="bResume"></button>
    <button class="go ghost" id="bMenuBook"></button>
    <button class="go ghost" id="bRestart"></button>
    <p class="fine" id="mFine"></p>

        const an = j / N * Math.PI * 2, ca = Math.cos(an), sa = Math.sin(an);
        const wob = 1 + .14 * (fbm(x * .5 + j * .7, z * .5 + ring * .03) - .5) * 2;
        const ox = ca * r * wob, oy = sa >= 0 ? sa * h * (.85 + .3 * fbm(x * .3 + j, z * .3)) : -.04 + .1 * (1 - Math.abs(sa)) * Math.abs(ca);
        const px = x + nx * ox, py = fl + oy, pz = z + nz * ox;
        const cxp = x, cyp = fl + h * .45, czp = z, dl = Math.hypot(cxp - px, cyp - py, czp - pz) || 1;
        const sh = .75 + .5 * fbm(px * .8, py * .8 + pz * .3), col = sa < -.2 ? [.40, .34, .28] : rockC.map(v => v * sh);
        g.vert(px, py, pz, (cxp - px) / dl, (cyp - py) / dl, (czp - pz) / dl, col[0], col[1], col[2]);
      }
      if (prev >= 0) for (let j = 0; j < N; j++) { const j2 = (j + 1) % N; g.tri(prev + j, base + j, prev + j2); g.tri(prev + j2, base + j, base + j2); }
      prev = base; ring++;
    }
  }
  // end caps
  for (const e of [0, Q.length - 1]) { const p = Q[e], c = [p[0], p[2] + p[4] * .45, p[1]];
    const q = Q[e ? e - 1 : 1], d = Math.hypot(q[0] - p[0], q[1] - p[1]), ux = (p[0] - q[0]) / d, uz = (p[1] - q[1]) / d;
    for (let j = 0; j < 12; j++) { const a0 = j / 12 * Math.PI * 2, a1 = (j + 1) / 12 * Math.PI * 2;
      const P0 = [p[0] + ux * .3 - uz * Math.cos(a0) * p[3] * 1.1, p[2] + p[4] * (.45 + .6 * Math.sin(a0)), p[1] + uz * .3 + ux * Math.cos(a0) * p[3] * 1.1];
      const P1 = [p[0] + ux * .3 - uz * Math.cos(a1) * p[3] * 1.1, p[2] + p[4] * (.45 + .6 * Math.sin(a1)), p[1] + uz * .3 + ux * Math.cos(a1) * p[3] * 1.1];
      g.ftri(c, P0, P1, [.3, .25, .2]); } }
  // stalactites, stalagmites, flowstone and sleeping bats in the chambers
  seed = 77;
  for (const ci of [4, 5, 12, 13]) {
    const p = Q[ci];
    for (let k = 0; k < 26; k++) {
      const a = rnd() * Math.PI * 2, rr = rnd() * p[3] * .8, x = p[0] + Math.cos(a) * rr, z = p[1] + Math.sin(a) * rr, ceil = p[2] + p[4] * .85 * Math.sqrt(1 - (rr / p[3]) ** 2);
      const len = .4 + rnd() * 1.4, col = [.72, .64, .52].map(v => v * (.85 + rnd() * .25));
      g.cone(x, ceil + .2, z, .12 + rnd() * .15, -len - .2, 6, col, col.map(v => v * .85));
      if (k % 3 === 0 && rr < p[3] - 1.8) { const fl = caveGround(x, z); g.cone(x, fl - .05, z, .2 + rnd() * .2, .4 + rnd() * .9, 6, col, col.map(v => v * .85)); }
    }
    if (ci === 4 || ci === 12) for (let k = 0; k < 7; k++) {  // bats: tiny dark folded wings hanging from the roof
      const a = rnd() * Math.PI * 2, rr = rnd() * p[3] * .5, x = p[0] + Math.cos(a) * rr, z = p[1] + Math.sin(a) * rr, y = p[2] + p[4] * .8 - .1;
      g.box(x, y - .12, z, .07, .22, .06, [.12, .1, .09], a); g.box(x, y - .02, z, .16, .05, .04, [.1, .08, .07], a);
    }
  }
  return g.upload(litProg());
}

function deer(g, x, z, ry, buck) {
  const y = height(x, z), co = Math.cos(ry), si = Math.sin(ry), W = (lx, lz) => [x + lx * co + lz * si, z - lx * si + lz * co];
  const fur = [.55, .38, .24], dark = [.34, .24, .16], belly = [.82, .72, .58];
  const B = (lx, ly, lz, sx, sy, sz, c) => { const p = W(lx, lz); g.box(p[0], y + ly, p[1], sx, sy, sz, c, ry); };
  B(0, .98, 0, .36, .42, 1.05, fur); B(0, .8, 0, .3, .08, .9, belly);
  for (const lx of [-.12, .12]) for (const lz of [-.4, .38]) B(lx, .4, lz, .08, .8, .09, dark);
  B(0, 1.32, .5, .17, .46, .2, fur); B(0, 1.56, .66, .15, .17, .34, fur); B(0, 1.53, .84, .09, .1, .08, dark);
  for (const lx of [-.08, .08]) B(lx, 1.7, .58, .05, .14, .05, dark);
  B(0, 1.05, -.54, .1, .14, .05, [.95, .93, .88]);
  if (buck) for (const lx of [-.07, .07]) { B(lx * 1.6, 1.86, .6, .03, .3, .03, [.78, .7, .55]); B(lx * 2.6, 1.98, .66, .03, .18, .03, [.78, .7, .55]); B(lx * 1.9, 2.0, .52, .03, .2, .03, [.78, .7, .55]); }
  COLLIDERS.push({ x, z, r: .6 });
}

// letters are handed out in a scrambled order so the passport does not simply spell the answer
S.solved = S.solved || {}; S.seen = S.seen || {};
function savePz() { try { localStorage.setItem('avh-solved-' + LV.id, JSON.stringify(S.solved)); localStorage.setItem('avh-seen-' + LV.id, JSON.stringify(S.seen)); } catch (e) {} }
const norm = v => String(v || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/\b(de|het|een|the|a|an|el|la|un|una)\b/g, '').replace(/[^a-z0-9]/g, '');
const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const stampName = id => (T().stamps.find(x => x[0] === id) || [])[1] || '';

let pzOpen = null, pzTimers = [];
function clearPzTimers() { pzTimers.forEach(clearTimeout); pzTimers = []; }
function openPuzzle(id, onSolve) {
  if (pzOpen) return;
  pzOpen = { id, onSolve: onSolve || (() => award(id)) };
  S.seen[id] = true; savePz();
  S.playing = false; S.keys = {};
  const t = T(), p = t.pz[id];
  $('pzEy').textContent = t.stampBox + ' · ' + stampName(id);
  $('pzTitle').textContent = p.t; $('pzStory').textContent = p.s; $('pzClue').textContent = p.c;
  $('pzMsg').textContent = ''; $('pzCheck').style.display = 'none'; $('pzLater').textContent = t.later;
  $('pzCheck').textContent = t.check;
  buildPuzzle(id, $('pzBody'));
  $('pz').classList.remove('gone');
}
function closePuzzle(resume = true) {
  clearPzTimers(); $('pz').classList.add('gone'); pzOpen = null;
  if (resume && $('menu').classList.contains('gone') && $('book').classList.contains('gone')) S.playing = true;
}
function wrong() { const m = $('pzMsg'); m.textContent = T().wrong; m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake'); }
function solvedPuzzle() {
  if (!pzOpen) return;
  const { id, onSolve } = pzOpen, t = T();
  S.solved[id] = true; savePz(); clearPzTimers(); chirp(); setTimeout(chirp, 140); setTimeout(chirp, 300);
  const L = LETTERS[id];
  $('pzCheck').style.display = 'none'; $('pzMsg').textContent = '';
  $('pzBody').innerHTML = `<div class="pz-solved"><b>${esc(t.solved)}</b>${L ? `<p>${esc(t.letterGot)}</p><div class="tile big">${L}</div>` : ''}</div>`;
  $('pzLater').textContent = t.next;
  $('pzLater').onclick = () => { $('pzLater').onclick = () => closePuzzle(); closePuzzle(); onSolve(); };
}

function buildPuzzle(id, el) {
  const t = T(), p = t.pz[id], kind = PZ[id].kind;
  $('pzLater').onclick = () => closePuzzle();
  if (kind === 'code') {
    const d = [0, 0, 0];
    el.innerHTML = `<div class="lock">${d.map((_, i) => `<div class="dial"><button data-i="${i}" data-d="1">▲</button><span id="dg${i}">0</span><button data-i="${i}" data-d="-1">▼</button></div>`).join('')}</div>`;
    el.querySelectorAll('button').forEach(b => b.onclick = () => { const i = +b.dataset.i; d[i] = (d[i] + +b.dataset.d + 10) % 10; $('dg' + i).textContent = d[i]; $('pzMsg').textContent = ''; });
    $('pzCheck').style.display = ''; $('pzCheck').onclick = () => d.join('') === PZ[id].answer ? solvedPuzzle() : wrong();
  } else if (kind === 'text') {
    let extra = '';
    if (PZ[id].cipher) extra = `<div class="cipher">${esc(p.code)}</div>`;
    if (PZ[id].final) {
      const got = Object.keys(LETTERS).filter(k => S.solved[k]).map(k => LETTERS[k]);
      const shuffled = got.map((l, i) => [l, Math.sin(i * 12.9898 + 4.1)]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
      extra = `<p class="small">${esc(t.letters)}</p><div class="tiles">${shuffled.map(l => `<div class="tile">${l}</div>`).join('') || '–'}</div>`;
    }
    el.innerHTML = `${extra}<input id="pzIn" class="pz-in" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="20">`;
    const inp = $('pzIn'), check = () => PZ[id].answers.includes(norm(inp.value)) ? solvedPuzzle() : wrong();
    inp.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') check(); };
    $('pzCheck').style.display = ''; $('pzCheck').onclick = check;
    setTimeout(() => { try { inp.focus(); } catch (e) {} }, 60);
  } else if (kind === 'simon') {
    const cols = ['#D9774B', '#2BA8A4', '#E8C95B', '#7DA05C'], seq = [];
    for (let i = 0; i < (PZ[id].len || 5); i++) seq.push(Math.floor(Math.random() * 4));
    el.innerHTML = `<p class="small" id="smHint"></p><div class="planks">${cols.map((c, i) => `<button class="plank" data-i="${i}" style="--c:${c}"></button>`).join('')}</div>`;
    const btns = [...el.querySelectorAll('.plank')]; let pos = 0, busy = true;
    const flash = (i, ms = 420) => { btns[i].classList.add('lit'); pzTimers.push(setTimeout(() => btns[i].classList.remove('lit'), ms)); };
    const play = () => {
      busy = true; pos = 0; $('smHint').textContent = t.simonWatch;
      seq.forEach((v, k) => pzTimers.push(setTimeout(() => { flash(v); chirp(); }, 700 + k * 650)));
      pzTimers.push(setTimeout(() => { busy = false; $('smHint').textContent = t.simonGo; }, 700 + seq.length * 650));
    };
    btns.forEach(b => b.onclick = () => {
      if (busy) return; const i = +b.dataset.i; flash(i, 220);
      if (i !== seq[pos]) { wrong(); pzTimers.push(setTimeout(play, 900)); return; }
      if (++pos === seq.length) pzTimers.push(setTimeout(solvedPuzzle, 350));
    });
    play();
  } else if (kind === 'pipes') {
    // 3x3 stone channel. Openings as bits: N=1 E=2 S=4 W=8. Base I = N|S, L = N|E.
    const rot = (m, r) => { for (let k = 0; k < r; k++) m = ((m << 1) | (m >> 3)) & 15; return m; };
    const sol = { '0,1': ['I', 0], '1,1': ['L', 0], '1,2': ['L', 2], '2,2': ['L', 3], '2,1': ['L', 1] };
    const cells = [];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
      const s = sol[r + ',' + c], type = s ? s[0] : ((r * 3 + c) % 2 ? 'I' : 'L');
      const rr = s ? (s[1] + 1 + ((r + c) % 3)) % 4 : (r * 2 + c) % 4;
      cells.push({ r, c, type, rot: rr });
    }
    const mask = cl => rot(cl.type === 'I' ? 5 : 3, cl.rot);
    const trace = () => {   // follow the water from the top inlet of (0,1)
      let r = 0, c = 1, enter = 1; const wet = new Set();
      for (let n = 0; n < 12; n++) {
        if (r < 0 || r > 2 || c < 0 || c > 2) return { wet, ok: false };
        const m = mask(cells[r * 3 + c]); if (!(m & enter)) return { wet, ok: false };
        wet.add(r * 3 + c); const out = m & ~enter;
        if (out === 4 && r === 2 && c === 1) return { wet, ok: true };
        if (out === 1) { r--; enter = 4; } else if (out === 2) { c++; enter = 8; } else if (out === 4) { r++; enter = 1; } else { c--; enter = 2; }
      }
      return { wet, ok: false };
    };
    const svg = (cl, wet) => {
      const m = mask(cl), col = wet ? '#2BA8A4' : '#b9ab90', arm = (x2, y2) => `<line x1="30" y1="30" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="14" stroke-linecap="round"/>`;
      return `<svg viewBox="0 0 60 60" width="100%" height="100%"><rect x="2" y="2" width="56" height="56" rx="8" fill="#7d6b58"/>${m & 1 ? arm(30, 0) : ''}${m & 2 ? arm(60, 30) : ''}${m & 4 ? arm(30, 60) : ''}${m & 8 ? arm(0, 30) : ''}<circle cx="30" cy="30" r="7" fill="${col}"/></svg>`;
    };
    const draw = () => {
      const { wet, ok } = trace();
      el.innerHTML = `<p class="small">${esc(t.pipesHint)}</p><div class="pipes-wrap"><div class="inlet">▼</div><div class="pipes">${cells.map((cl, i) => `<button data-i="${i}">${svg(cl, wet.has(i))}</button>`).join('')}</div><div class="outlet">▼</div></div>`;
      el.querySelectorAll('.pipes button').forEach(b => b.onclick = () => { cells[+b.dataset.i].rot = (cells[+b.dataset.i].rot + 1) % 4; draw(); });
      if (ok) pzTimers.push(setTimeout(solvedPuzzle, 500));
    };
    draw();
  } else if (kind === 'order') {
    const steps = p.steps, order = steps.map((s, i) => i).sort((a, b) => Math.sin(a * 7.3 + 1) - Math.sin(b * 7.3 + 1));
    let picked = [];
    const draw = () => {
      el.innerHTML = `<p class="small">${esc(t.orderHint)}</p><div class="steps">${order.map(i => { const n = picked.indexOf(i);
        return `<button data-i="${i}" class="${n >= 0 ? 'on' : ''}"><span>${n >= 0 ? n + 1 : ''}</span>${esc(steps[i])}</button>`; }).join('')}</div>`;
      el.querySelectorAll('.steps button').forEach(b => b.onclick = () => {
        const i = +b.dataset.i; if (picked.includes(i)) return;
        picked.push(i);
        if (i !== picked.length - 1) { wrong(); picked = []; pzTimers.push(setTimeout(draw, 650)); draw(); return; }

      });
    };

    if (im && im.complete) { const pw = w - 10 * dpr, ph = pw / 1.5; c.fillStyle = '#fff'; c.fillRect(3 * dpr, 3 * dpr, w - 6 * dpr, ph + 7 * dpr + (mapBig ? 22 * dpr : 0)); c.drawImage(im, 5 * dpr, 5 * dpr, pw, ph);
      if (mapBig) { c.fillStyle = '#5b4636'; c.font = `600 ${Math.round(11 * dpr)}px -apple-system, Segoe UI, sans-serif`; c.textAlign = 'center'; c.fillText(tempWord(Math.hypot(goal.x - S.x, goal.z - S.z)), w / 2, ph + 22 * dpr); } }
    return;
  }
  if (LV.hard) {   // no map with points on compass routes: show a compass card instead
    c.fillStyle = '#f4ead7'; c.fillRect(0, 0, w, h);
    const r = Math.min(w, h) * .42, cx0 = w / 2, cy0 = Math.min(h / 2, r + 8 * dpr), yaw = S.camYaw;
    c.beginPath(); c.arc(cx0, cy0, r, 0, Math.PI * 2); c.fillStyle = '#fffaf0'; c.fill(); c.lineWidth = 1.5 * dpr; c.strokeStyle = '#5b4636'; c.stroke();
    for (let k = 0; k < 16; k++) { const a = k / 16 * Math.PI * 2 + yaw, l = k % 4 ? .1 : .2; c.beginPath(); c.moveTo(cx0 + Math.sin(a) * r * (1 - l), cy0 - Math.cos(a) * r * (1 - l)); c.lineTo(cx0 + Math.sin(a) * r, cy0 - Math.cos(a) * r); c.stroke(); }
    c.font = `700 ${Math.round(r * .3)}px Georgia, serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    HARD_UI[lang].dirs.filter((_, i) => i % 2 === 0).forEach((d, i) => { const a = i * Math.PI / 2 + yaw; c.fillStyle = i ? '#5b4636' : '#D9774B'; c.fillText(d, cx0 + Math.sin(a) * r * .6, cy0 - Math.cos(a) * r * .6); });
    c.beginPath(); c.moveTo(cx0, cy0 - r * .95); c.lineTo(cx0 - r * .08, cy0 - r * .75); c.lineTo(cx0 + r * .08, cy0 - r * .75); c.closePath(); c.fillStyle = '#143628'; c.fill();
    if (h > 2.6 * r) { c.fillStyle = '#5b4636'; c.font = `600 ${Math.round(Math.min(11 * dpr, w * .14))}px -apple-system, Segoe UI, sans-serif`; c.fillText(Math.round(((-yaw * 180 / Math.PI) % 360 + 720) % 360) + '°', cx0, cy0 + r + 14 * dpr);
      if (mapBig) { c.font = `500 ${Math.round(10 * dpr)}px -apple-system, Segoe UI, sans-serif`; c.fillText(HARD_UI[lang].noMap, cx0, cy0 + r + 32 * dpr); } }
    return;
  }
  c.drawImage(mapBG, 0, 0, w, h);
  const P2 = (x, z) => [(x - MAPX[0]) / (MAPX[1] - MAPX[0]) * w, (z - Z0) / (Z1 - Z0) * h];
  const goal = nextGoal(), sz = (mapBig ? 7 : 4.2) * dpr, st = T().stamps;
  STAMP_POS().forEach((p, i) => {
    const [x, y] = P2(p.x, p.z), done = S.stamps[p.id];
    c.beginPath(); c.arc(x, y, sz, 0, Math.PI * 2);
    c.fillStyle = done ? '#D9774B' : 'rgba(255,255,255,.92)'; c.fill();
    c.lineWidth = 1.2 * dpr; c.strokeStyle = done ? '#fff' : '#D9774B'; c.stroke();
    if (goal && goal.id === p.id) { c.beginPath(); c.arc(x, y, sz + (2.5 + 1.5 * Math.sin(S.t * 4)) * dpr, 0, Math.PI * 2); c.strokeStyle = '#fff'; c.lineWidth = 1.4 * dpr; c.stroke(); }
    c.fillStyle = done ? '#fff' : '#143628'; c.font = `700 ${Math.round(sz * 1.25)}px -apple-system, Segoe UI, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(done ? '✓' : String(i + 1), x, y + .5 * dpr);
    if (mapBig) { const t = (st.find(q => q[0] === p.id) || [])[1] || ''; c.font = `600 ${Math.round(10.5 * dpr)}px -apple-system, Segoe UI, sans-serif`; c.textAlign = x > w * .55 ? 'right' : 'left';
      const tx = x + (x > w * .55 ? -1 : 1) * (sz + 4 * dpr); c.lineWidth = 3 * dpr; c.strokeStyle = 'rgba(20,54,40,.75)'; c.strokeText(t, tx, y); c.fillStyle = '#fff'; c.fillText(t, tx, y); }
  });
  // player arrow (top of the map = upstream / start)
  const [px, py] = P2(S.x, S.z), a = Math.atan2(Math.sin(S.face), Math.cos(S.face)), r = (mapBig ? 9 : 6.5) * dpr;
  c.save(); c.translate(px, py); c.rotate(-a);
  c.beginPath(); c.moveTo(0, r); c.lineTo(r * .65, -r * .6); c.lineTo(0, -r * .25); c.lineTo(-r * .65, -r * .6); c.closePath();
  c.fillStyle = '#ffffff'; c.fill(); c.lineWidth = 1.6 * dpr; c.strokeStyle = '#143628'; c.stroke(); c.restore();
}

/* ----------------------------------------------------------- loop */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render(); updateAudio(); drawMap();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (AC) document.hidden ? AC.suspend() : AC.resume(); });

applyLang(); resize();
setTimeout(() => {
  try { build(); } catch (e) { console.error(e); $('errText').textContent = e.message; $('err').style.display = 'grid'; $('err').classList.remove('gone'); }
  $('loading').classList.add('gone');
  requestAnimationFrame(frame);
}, 30);
window.__AVH = S; window.__AVHg = groundAt; window.__AVHl = { deck: () => DECK, onDeck: (x, z) => onDeck(x, z), cam: (p, l) => { PHOTO_CAM = p ? { pos: p, look: l } : null; }, photos: () => PHOTOS, caveTravel, startLine, clueFor, caveSeg, cave: () => CAVE_ON, loadLevel, lv: () => LV, st: () => STAMP_POS(), npcs: () => NPCS, height, waterY, cx, riverW, wallStart, blocked: (typeof blocked !== 'undefined' ? blocked : null), openPuzzle, award, T };
window.__AVHt = { height, normalAt, cx, riverW, wallStart, MIRADOR, blocked, ABSEIL, SLIDE, DECK, waterY, openPuzzle, openBook, COLLIDERS }; // for testing
})();
